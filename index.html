<html lang="pt-BR">

<style>
:root{
  --bg:#FAF7F2;--panel:#FFFFFF;--panel2:#F3EEE6;
  --text:#1F1B17;--muted:#8A8378;--line:#EBE5DB;
  --accent:#C1765A;--accent-soft:#F5E7DF;--ink:#FFFFFF;
  --mint:#7A9885;--pink:#C99B9B;--gold:#C9A961;
  --shadow:220 210 195;
  --font-sans:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-serif:'Fraunces','Playfair Display',Georgia,serif;
  color-scheme:light;
}
body.dark{
  --bg:#161412;--panel:#201D1A;--panel2:#2A2622;
  --text:#F5F0E8;--muted:#9A9288;--line:#35302B;
  --accent:#D88D70;--accent-soft:#3A2C24;--ink:#1F1B17;
  --mint:#93B39E;--pink:#D4A5A5;--gold:#D9BC7A;
  --shadow:15 13 11;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14.5px/1.6 var(--font-sans);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);min-height:44px;border-radius:14px;padding:10px 16px;font-weight:600;display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:transform .15s ease,background .15s ease,border-color .15s ease}
button:disabled{opacity:.4;cursor:default}
button:active:not(:disabled){transform:scale(.985)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;min-height:46px;transition:border-color .15s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:88px}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--accent)}
input[type=color]{padding:4px}
input[type=range]{padding:0;min-height:40px}
label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin:16px 0 7px;letter-spacing:.02em}
.shell{max-width:520px;margin:auto;min-height:100dvh}
header{position:sticky;z-index:4;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;padding-top:max(14px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header .modern-brand{display:flex;align-items:center;gap:8px;background:transparent;border:none;padding:0;min-height:44px;font-family:var(--font-serif);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--text)}
header .modern-brand .sprite{width:32px;height:32px}
header .modern-actions{display:flex;gap:6px}
header .modern-actions button,header .modern-profile{width:40px;height:40px;min-height:40px;border-radius:12px;padding:8px;background:var(--panel);border:1px solid var(--line)}
header .modern-profile .icon{color:var(--text)}
main{padding:12px 20px calc(120px + env(safe-area-inset-bottom));min-width:0}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.02em}
h1{font-size:28px;line-height:1.15;margin:8px 0 10px;letter-spacing:-.03em}
h2{font-size:18px;line-height:1.25;margin:0}
h3{font-size:15px;margin:0}
p{line-height:1.65;margin:6px 0 12px;font-size:13.5px}
.muted,small{color:var(--muted)}
small{font-size:11.5px;line-height:1.5}
.eyebrow{text-transform:uppercase;font-family:var(--font-sans);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--muted);margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.start{justify-content:flex-start}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.section{margin-top:28px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.primary:hover:not(:disabled){filter:brightness(1.03)}
.wide{width:100%;margin-top:12px}
.quiet{background:transparent;border:0;padding:6px 8px;color:var(--muted);min-height:40px}
.quiet:hover{color:var(--text)}
.danger{color:var(--pink)}
.positive{color:var(--mint)}
.gold{color:var(--gold)}
.icon{width:20px;height:20px;display:inline-block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.icon-btn{width:44px;flex-shrink:0;padding:8px}
.sprite{width:80px;height:80px;object-fit:contain;display:block}
.smallcat{width:48px;height:48px}
.bigcat{width:112px;height:112px}
.pixel{font-family:var(--font-sans);letter-spacing:-.01em}
progress{display:block;width:100%;height:6px;border:0;appearance:none;border-radius:3px;overflow:hidden;background:var(--panel2)}
progress::-webkit-progress-bar{background:var(--panel2);border-radius:3px}
progress::-webkit-progress-value{background:var(--accent);border-radius:3px}
progress::-moz-progress-bar{background:var(--accent);border-radius:3px}
.scene{height:168px;position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:18px 0 12px;background:var(--panel2)}
body[data-scene="garden"] .scene{background:radial-gradient(ellipse at 75% 25%,rgba(255,220,180,.55) 0%,transparent 45%),linear-gradient(180deg,#C8D5C2 0%,#98AE8F 45%,#5F7259 100%)}
body[data-scene="sunset"] .scene{background:radial-gradient(ellipse at 70% 30%,#FFD9A8 0%,transparent 50%),linear-gradient(180deg,#E8AE85 0%,#C1765A 55%,#6B4A3A 100%)}
body[data-scene="rain"] .scene{background:radial-gradient(ellipse at 50% 100%,rgba(200,215,230,.35) 0%,transparent 60%),linear-gradient(180deg,#9AAFC0 0%,#5F7488 55%,#34455A 100%)}
.scene .sprite{position:absolute;bottom:20px;left:calc(50% - 43px);width:86px;height:86px;animation:float 4s ease-in-out infinite}
.scene .sidecat{width:56px;height:56px;left:14px;bottom:20px;animation-delay:-1.5s;opacity:.95}
.scene .sidecat.right{left:auto;right:12px;width:64px;height:64px;animation-delay:-.7s}
.scene-label{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.85);color:#1F1B17;padding:5px 10px;border-radius:8px;font:600 10px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.dark .scene-label{background:rgba(32,29,26,.85);color:var(--text)}
.stat{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--panel)}
.stat strong{display:block;font-size:18px;font-family:var(--font-serif);font-weight:600}
.stat .icon{color:var(--accent)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel2);border-radius:14px;margin:16px 0}
.tabs button{flex:1;min-height:36px;padding:8px 6px;font-size:12px;font-weight:600;background:none;border:0;color:var(--muted);border-radius:10px}
.tabs .selected{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;font-size:12px;min-height:34px;padding:6px 14px;border-radius:100px;background:var(--panel)}
.chips .selected,.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:8px 0;padding:12px 14px;transition:border-color .15s ease}
.task:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.task .check{border:0;background:var(--panel2);padding:0;width:32px;height:32px;min-height:32px;border-radius:10px;flex-shrink:0;color:var(--muted);display:grid;place-items:center}
.task .title{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;display:block}
.task small{display:block;margin-top:3px;color:var(--muted)}
.task.done .title{text-decoration:line-through;color:var(--muted);opacity:.65}
.task.done .check{color:var(--accent);background:var(--accent-soft)}
.badge{font-size:9px;padding:3px 8px;background:var(--panel2);border-radius:100px;white-space:nowrap;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.priority{color:var(--pink)}
.empty{text-align:center;padding:32px 16px}
.empty .sprite{width:88px;height:88px;margin:0 auto 8px}
.empty p{color:var(--muted);font-size:13px;max-width:280px;margin:8px auto;line-height:1.6}
.empty h3{margin-top:6px;font-size:16px}
.search{position:relative}
.search input{padding-left:42px;font-size:14px;background:var(--panel);border-radius:14px}
.search .icon{position:absolute;left:14px;top:13px;color:var(--muted)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);padding:8px 10px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav button{flex-direction:column;gap:4px;font-size:10px;padding:6px 2px;min-height:52px;border:0;background:none;color:var(--muted);font-weight:600;border-radius:12px;letter-spacing:.01em}
nav .active{color:var(--accent)}
nav .active .icon{stroke-width:2}
nav .icon{width:22px;height:22px}
dialog{width:calc(100% - 24px);max-width:456px;max-height:90dvh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:24px;padding:22px;z-index:100}
dialog::backdrop{background:rgba(20,16,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog h2{font-size:20px;font-family:var(--font-serif)}
.checklabel{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:15px 0}
.calendar button{min-width:0;min-height:40px;padding:2px;border:1px solid transparent;background:none;font-size:13px;position:relative;border-radius:10px;font-weight:500}
.calendar button:hover{background:var(--panel2)}
.calendar small{text-align:center;padding:8px 0;font-weight:600;letter-spacing:.04em}
.calendar button.selected{background:var(--accent);color:var(--ink)}
.calendar .dot::after{content:'';width:4px;height:4px;position:absolute;bottom:5px;left:50%;transform:translateX(-50%);background:var(--accent);border-radius:50%}
.timer{height:230px;width:230px;margin:24px auto 28px;border:3px solid var(--panel2);border-top-color:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--panel);position:relative}
.timer strong{font:600 46px var(--font-serif);letter-spacing:-.03em}
.timer .sprite{width:64px;height:64px}
.timer small{letter-spacing:.2em;margin-top:6px;font-weight:700;font-size:10px}
.money{font-size:30px;letter-spacing:-.02em;font-weight:600;font-family:var(--font-serif);overflow-wrap:anywhere}
.finance-hero{position:relative;padding:22px;overflow:hidden;border-color:color-mix(in srgb,var(--accent) 25%,var(--line));background:linear-gradient(135deg,var(--accent-soft),var(--panel) 70%)}
.finance-hero .sprite{position:absolute;right:14px;top:12px;width:72px;height:72px;opacity:.9}
.finance-hero .money{padding-right:72px}
.balance-grid{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.balance-grid b{display:block;margin-top:5px;font-size:15px;overflow-wrap:anywhere;font-weight:600}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:10px 0}
.bar i{height:100%;display:block;background:var(--accent);border-radius:3px;transition:width .4s ease}
.bar.over i{background:var(--pink)}
.entry{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border:0}
.entry .entry-icon{width:38px;height:38px;background:var(--panel2);display:grid;place-items:center;border-radius:11px;flex-shrink:0;color:var(--muted)}
.entry b{font-size:13px;overflow-wrap:anywhere;font-weight:600}
.entry small{display:block}
.entry .amount{font-size:13px;text-align:right;white-space:nowrap;font-weight:600}
.menu-item{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--panel);border:1px solid var(--line);padding:15px 16px;margin:8px 0;border-radius:16px;min-height:52px}
.menu-item .icon{color:var(--muted)}
.cats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cat-choice{flex-direction:column;padding:12px 4px;font-size:12px;gap:4px;border-radius:18px;background:var(--panel)}
.cat-choice .sprite{width:72px;height:72px;max-width:100%}
.cat-choice small{font-size:10px;color:var(--muted)}
.cat-choice.selected{border-color:var(--accent);background:var(--accent-soft)}
.rewardcard{position:relative;overflow:hidden}
.rewardcard .sprite{width:56px;height:56px}
.habit{padding:14px}
.habit .week{display:flex;gap:5px;margin-top:12px}
.week span{flex:1;text-align:center;padding:5px 0;border:1px solid var(--line);border-radius:6px;font-size:9px;color:var(--muted)}
.week .hit{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.subtask{display:flex;align-items:center;gap:10px;padding:8px 0}
.subtask label{margin:0}
.subtask button{background:none;border:0;padding:0;min-height:32px;color:var(--accent)}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);max-width:90%;width:max-content;z-index:20;background:var(--text);color:var(--bg);padding:13px 20px;border-radius:14px;font-size:12.5px;font-weight:500;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.checklist{padding:0;margin:8px 0;list-style:none}
.footnote{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.6}
.palette{display:flex;gap:10px;flex-wrap:wrap}
.palette button{height:38px;min-height:38px;width:38px;border:2px solid var(--line);border-radius:50%;padding:0}
.palette button.selected{outline:2px solid var(--text);outline-offset:3px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.nq-welcome{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 20px}
.nq-welcome__copy{flex:1;min-width:0}
.nq-welcome__copy .nq-date{font-size:12px;color:var(--muted);text-transform:capitalize;margin:0 0 8px;font-weight:500;letter-spacing:.01em}
.nq-welcome h1{margin:0 0 8px;font-size:30px;line-height:1.1;overflow-wrap:anywhere;font-weight:600;letter-spacing:-.03em;font-family:var(--font-serif)}
.nq-welcome .nq-sub{font-size:13px;margin:0;color:var(--muted)}
.nq-cat-button{background:var(--panel2);border:none;width:88px;height:88px;min-height:88px;border-radius:24px;padding:4px;flex-shrink:0;display:grid;place-items:center}
.nq-cat-button .sprite{width:75px;height:75px;animation:float 4s ease-in-out infinite}
.nq-bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.nq-bento>.nq-tile{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px;transition:border-color .15s ease,transform .15s ease;min-height:130px}
.nq-bento>.nq-tile:hover{border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.nq-bento>.nq-tile:active{transform:scale(.99)}
.nq-tile__icon{display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border-radius:12px;width:36px;height:36px;margin-bottom:4px}
.nq-tile__icon .icon{width:18px;height:18px}
.nq-tile__name{color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.nq-bento>.nq-tile strong{font-size:19px;color:var(--text);letter-spacing:-.02em;overflow-wrap:anywhere;font-weight:600;line-height:1.2;font-family:var(--font-serif)}
.nq-bento>.nq-tile strong small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);font-family:var(--font-sans)}
.nq-bento>.nq-tile .nq-tile__detail{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:auto}
.nq-tile--wide{grid-column:1/-1;display:grid!important;grid-template-columns:48px minmax(0,1fr) auto;align-items:center!important;gap:14px!important;padding:18px!important;min-height:0!important}
.nq-tile--wide .nq-tile__icon{margin:0!important;width:48px;height:48px;border-radius:14px}
.nq-tile--wide .nq-tile__icon .icon{width:22px;height:22px}
.nq-tile--wide strong{font-size:17px!important;font-weight:600!important}
.nq-tile--wide .nq-tile__detail{margin:3px 0 0!important}
.fab{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));right:22px;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--ink);border:none;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent);display:grid;place-items:center;z-index:10;transition:transform .2s}
.fab .icon{width:26px;height:26px;stroke-width:2.4}
.fab:active{transform:scale(.94)}
.nq-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 12px}
.nq-section-head h2{margin:0;font-size:19px;font-weight:600}
.nq-section-head button{font-size:13px;border:0;min-height:36px;padding:5px 4px;color:var(--accent);background:transparent;font-weight:600}
.section-nav{display:flex;gap:4px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.section-nav::-webkit-scrollbar{display:none}
.section-nav button{white-space:nowrap;font-size:12px;min-height:34px;padding:6px 14px;border-radius:100px}
.area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area-card{display:flex;align-items:center;gap:12px;padding:16px;min-height:72px;justify-content:flex-start;border-radius:16px;background:var(--panel)}
.area-card .icon:first-child{color:var(--accent)}
.area-card b{flex:1;text-align:left;font-weight:600}
.area-card .icon:last-child{width:16px;height:16px;color:var(--muted)}
.nq-explore{margin-top:28px}
.nq-explore h2{font-size:18px;margin-bottom:4px}

let state,loadError=false;try{const stored=localStorage.getItem('nekoquest_v4');if(stored)state=Core.validate(JSON.parse(stored));else{const old=localStorage.getItem('nekoquest_v3');if(old)state=Core.migrate(JSON.parse(old));else{let legacy=JSON.parse(localStorage.getItem('neko_tasks_v1')||'[]');state=Core.migrate({tasks:legacy})}}}catch{state=Core.defaults();loadError=true}
let page='home',taskFilter='today',query='',categoryFilter='all',sort='priority',calMonth=Core.today().slice(0,7),day=Core.today(),finMonth=Core.today().slice(0,7),finTab='overview',historyTab='all',installPrompt=null,financeFilter='all',financeQuery='',appUpdate=false,missionView='list';
function save(){if(loadError){toast('Importe um backup para retomar o salvamento. O arquivo anterior foi preservado.');return false}try{localStorage.setItem('nekoquest_v4',JSON.stringify(state));return true}catch{toast('Armazenamento indisponível. Exporte seu backup.');return false}}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
const btn=(action,label,cl='')=>`<button class="${cl}" data-action="${action}">${label}</button>`;
const empty=(title,desc,skin='mochi')=>`<div class="empty">${cat(skin)}<h3>${title}</h3><p>${desc}</p></div>`;
const head=(k,title,desc='')=>`<div class="eyebrow">${k}</div><h1>${title}</h1>${desc?`<p class="muted">${desc}</p>`:''}`;
function go(p){if(p==='habits'){p='tasks';missionView='routines'}page=p;render();window.scrollTo({top:0,behavior:'instant'});$('#app').focus({preventScroll:true})}
function modal(title,body){$('#modal').innerHTML=`<div class="row"><h2>${title}</h2><button class="quiet icon-btn" data-action="close" aria-label="Fechar">${icon('close')}</button></div>${body}`;$('#modal').showModal()}
function formField(label,name,value='',type='text',attrs=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs}></div>`}
function selectField(label,name,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(o=>{let [v,n]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(n)}</option>`}).join('')}</select></div>`}
function monthSwitch(m,action){return `<div class="row card"><button class="quiet icon-btn" data-action="${action}" data-dir="-1" aria-label="Mês anterior">${icon('back')}</button><b>${monthLabel(m)}</b><button class="quiet icon-btn" data-action="${action}" data-dir="1" aria-label="Próximo mês">${icon('arrow')}</button></div>`}
function moveMonth(m,dir){let d=new Date(m+'-01T12:00');d.setMonth(d.getMonth()+dir);return Core.date(d).slice(0,7)}
function taskList(tasks){return tasks.length?tasks.map(t=>`<article class="task ${t.done?'done':''} ${t.priority==='high'?'important':''}"><button class="check" data-action="complete" data-id="${esc(t.id)}" aria-pressed="${t.done}" aria-label="${t.done?'Reabrir':'Concluir'} ${esc(t.title)}">${icon(t.done?'check':'box')}</button><button class="task-body grow" data-action="task-detail" data-id="${esc(t.id)}"><span class="title">${esc(t.title)}</span><small><span class="category-dot ${esc(['Estudos','Trabalho','Saúde','Pessoal'].includes(t.category)?t.category:'Pessoal')}"></span>${esc(t.category||'Pessoal')} · <span class="${!t.done&&t.date<Core.today()?'danger':''}">${t.date===Core.today()?'Hoje':shortDate(t.date)}${t.time?' · '+esc(t.time):''}</span></small>${t.subtasks.length?`<span class="mini-progress"><i style="width:${t.subtasks.filter(x=>x.done).length/t.subtasks.length*100}%"></i></span>`:''}</button><div class="task-end">${t.id===state.pinnedTask?'<span class="priority-mark" aria-label="Próximo passo escolhido">★</span>':''}${t.priority==='high'?'<span class="priority-mark" aria-label="Prioridade alta">!</span>':''}<small class="xp-tag">${esc(t.xp)} XP</small>${t.repeat!=='none'?'<small aria-label="Recorrente">↻</small>':''}</div></article>`).join(''):empty('Espaço para o próximo passo','Crie uma tarefa pequena. Seu gatinho acompanha você.')}
function filteredTasks(){let ts=state.tasks.filter(t=>{if(t.archived)return false;if(taskFilter==='week'&&(t.date<Core.week(state)[0].day||t.date>Core.week(state)[6].day))return false;if(taskFilter==='today'&&(t.done||t.date>Core.today()))return false;if(taskFilter==='pending'&&t.done)return false;if(taskFilter==='done'&&!t.done)return false;if(taskFilter==='upcoming'&&(t.done||t.date<=Core.today()))return false;return t.title.toLocaleLowerCase().includes(query.toLocaleLowerCase())&&(categoryFilter==='all'||t.category===categoryFilter)});return ts.sort((a,b)=>sort==='priority'?(({high:2,normal:1,low:0}[b.priority]||0)-({high:2,normal:1,low:0}[a.priority]||0)||a.date.localeCompare(b.date)):a.date.localeCompare(b.date))}
function tasks(){const tabs=`<div class="tabs mission-tabs" role="group" aria-label="Visualização de tarefas">${[['list','Lista'],['calendar','Agenda'],['routines','Rotinas']].map(([v,n])=>`<button data-action="mission-view" data-value="${v}" class="${missionView===v?'selected':''}" aria-pressed="${missionView===v}">${n}</button>`).join('')}</div>`;let content='';if(missionView==='calendar')content=calendar();else if(missionView==='routines')content=routines();else content=`<div class="search">${icon('search')}<input id="search" placeholder="Buscar tarefa…" aria-label="Buscar tarefa" value="${esc(query)}"></div><div class="chips">${[['today','Hoje'],['pending','A fazer'],['week','Semana'],['upcoming','Próximas'],['done','Concluídas'],['all','Todas']].map(([v,n])=>`<button data-action="task-filter" data-value="${v}" class="${v===taskFilter?'selected':''}">${n}</button>`).join('')}</div><div class="grid"><select id="categoryFilter" aria-label="Filtrar categoria"><option value="all">Todas as categorias</option>${['Estudos','Trabalho','Saúde','Pessoal'].map(c=>`<option ${categoryFilter===c?'selected':''}>${c}</option>`).join('')}</select><select id="taskSort" aria-label="Ordenar tarefas"><option value="date" ${sort==='date'?'selected':''}>Por data</option><option value="priority" ${sort==='priority'?'selected':''}>Por prioridade</option></select></div><div id="task-results">${taskGroups(filteredTasks())}</div>`;return `<div class="row"><div>${head('TUDO EM UM SÓ LUGAR','Tarefas')}</div></div>${tabs}${content}`}
function calendar(){let d=new Date(calMonth+'-01T12:00'),count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return monthSwitch(calMonth,'calendar-month')+`<div class="calendar">${['D','S','T','Q','Q','S','S'].map(c=>`<small>${c}</small>`).join('')}${'<span></span>'.repeat(d.getDay())}${Array.from({length:count},(_,i)=>{let dt=calMonth+'-'+String(i+1).padStart(2,'0');return `<button data-action="day" data-value="${dt}" class="${dt===day?'selected':''} ${state.tasks.some(t=>t.date===dt&&!t.archived)?'dot':''}" aria-label="${shortDate(dt)}">${i+1}</button>`}).join('')}</div><div class="section row"><h2>${shortDate(day)}</h2><button class="quiet" data-action="calendar-today">Hoje</button></div>${taskList(state.tasks.filter(t=>t.date===day&&!t.archived))}`}
function focus(){const target=state.tasks.find(t=>t.id===state.focusTask),last=state.lastFocus,canFinish=last?.taskId&&state.tasks.some(t=>t.id===last.taskId&&!t.done);return head('UMA COISA DE CADA VEZ','Hora do foco')+`${last?`<div class="focus-finished"><div class="row"><b>${icon('check')} Sessão concluída</b><button class="quiet icon-btn" data-action="dismiss-focus" aria-label="Fechar resumo da sessão">${icon('close')}</button></div><p>${esc(last.title)}</p>${canFinish?`<button class="wide" data-action="finish-focused-task" data-id="${esc(last.taskId)}">Concluir esta tarefa</button>`:'<small>Mais um tempo dedicado a você.</small>'}</div>`:''}<div class="focus-context"><span class="eyebrow">${state.timer.mode==='focus'?'TAREFA EM FOCO':'HORA DE RESPIRAR'}</span><h2>${esc(state.timer.taskTitle||target?.title||'Foco livre')}</h2></div><div class="timer">${cat('sleep')}<strong id="clock">25:00</strong><small>${state.timer.mode==='focus'?'FOCO':'PAUSA'}</small></div><div class="row">${btn('timer-reset',icon('reset'),'icon-btn quiet')}${btn('timer',icon(state.timer.end?'pause':'play')+(state.timer.end?'Pausar':state.timer.startedAt?'Continuar':'Começar'),'primary grow')}${btn('timer-mode',state.timer.mode==='focus'?'Pausa':'Foco','quiet')}</div><div class="card"><label for="focusTask">Escolher tarefa</label><select id="focusTask" ${state.timer.startedAt?'disabled':''}><option value="">Foco livre</option>${state.tasks.filter(t=>!t.done&&t.date<=Core.today()).map(t=>`<option value="${esc(t.id)}" ${state.focusTask===t.id?'selected':''}>${esc(t.title)}</option>`).join('')}</select><details class="focus-settings"><summary>Ajustar duração · ${state.focus} / ${state.break} min</summary><form data-form="timer"><div class="grid">${formField('Foco (min)','focus',state.focus,'number','min="1" max="180" required')}${formField('Pausa (min)','break',state.break,'number','min="1" max="60" required')}</div><button class="wide">Salvar duração</button></form></details></div><p class="center muted">${state.sessions.length} sessões concluídas</p>`}

function render(){$('#app').dataset.page=page;document.querySelector('meta[name=theme-color]').setAttribute('content',state.theme==='light'?'#FAF7F2':'#161412');document.body.classList.toggle('dark',state.theme==='dark');document.body.classList.toggle('still',!state.preferences.motion);document.body.dataset.scene=state.preferences.scene;document.documentElement.style.setProperty('--accent',state.color);let hex=state.color.slice(1),rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255),lum=rgb.map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4).reduce((a,x,i)=>a+x*[.2126,.7152,.0722][i],0);document.documentElement.style.setProperty('--ink',lum>.18?'#1F1B17':'#FFFFFF');let bg=state.theme==='light'?.89:.008,contrast=(Math.max(bg,lum)+.05)/(Math.min(bg,lum)+.05);document.documentElement.style.setProperty('--accent-text',contrast>=4.5?state.color:state.theme==='light'?'#684299':'#c8b7ff');$('#header').innerHTML=`<div class="brand">${cat('luna','smallcat')}NekoQuest</div><button data-page="profile" aria-label="Abrir perfil">${cat(state.cat,'smallcat')}</button>`;let group=['calendar','focus','rewards','cats','history','profile','more','insights','journal','breathe','hydration','food','finance'].includes(page)?'profile':page;$('#nav').innerHTML=[['home','home','Início'],['tasks','task','Tarefas'],['calendar','calendar','Calendário'],['focus','clock','Foco'],['profile','user','Perfil']].map(([p,i,n])=>`<button data-page="${p}" class="${(page==='focus'?p==='focus':p===group)?'active':''}" ${page===p?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('');$('#app').innerHTML=({home,tasks,calendar,focus,rewards:rewardPage,finance:finances,history,cats:collection,more,profile,insights,journal,breathe,hydration,food}[page]||home)()+focusDock();tick();const fabActions={home:['quick-task','Nova tarefa'],tasks:['quick-task','Nova tarefa']};const action=fabActions[page];const fab=$('#fab');if(action){fab.hidden=false;fab.dataset.action=action[0];fab.setAttribute('aria-label',action[ function tick(){const t=state.timer,n=t.end?Math.max(0,Math.ceil((t.end-Date.now())/1000)):t.remaining;for(const selector of ['#clock','#mini-clock']){const el=$(selector);if(el)el.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}if(t.end&&n===0){const wasFocus=t.mode==='focus';if(wasFocus){const at=t.end,title=t.taskTitle||state.tasks.find(x=>x.id===state.focusTask)?.title||'Foco livre',taskId=t.taskId||state.focusTask||null;state.sessions.push({id:Core.id(),at,title,taskId,minutes:t.duration||state.focus});state.lastFocus={at,title,taskId}}state.timer={mode:wasFocus?'break':'focus',remaining:state[wasFocus?'break':'focus']*60,end:null};save();render();playModernSound('alert');modernNotify('NekoQuest',wasFocus?'Sua sessão de foco terminou. Hora de uma pausa.':'Sua pausa terminou. Continue no seu ritmo.','focus-end');toast(wasFocus?'Sessão concluída. Hora de uma pausa!':'Pausa concluída. Pronto para continuar?')}}

function startTaskFocus(id){let task=state.tasks.find(t=>t.id===id);if(!task||task.done){showIssue('Escolha uma tarefa pendente.');return}if(task.date>Core.today()){showIssue('Esta tarefa está planejada para '+shortDate(task.date)+'. Ajuste a data para começar hoje.');return}const timer=state.timer;if(timer.startedAt&&timer.taskId===task.id&&timer.mode==='focus'){state.focusTask=task.id;$('#modal').close();go('focus');return}if(timer.startedAt&&!confirm('Encerrar a sessão atual sem registrá-la e focar nesta tarefa?'))return;state.focusTask=task.id;state.lastFocus=null;state.timer={mode:'focus',remaining:state.focus*60,end:Date.now()+state.focus*60000,startedAt:Date.now(),taskId:task.id,taskTitle:task.title,duration:state.focus};save();$('#modal').close();go('focus')}

function upcomingBills(){const until=Core.addDays(Core.today(),7),bills=state.finance.entries.filter(e=>e.type==='expense'&&!e.paid&&e.date<=until&&e.date.startsWith(finMonth)).sort((a,b)=>a.date.localeCompare(b.date));if(!bills.length)return '';return `<div class="section row"><h2>Contas para cuidar</h2><small>Atrasadas e próximos 7 dias</small></div><div class="card bill-reminders">${bills.slice(0,3).map(e=>`<button data-action="settle" data-id="${esc(e.id)}"><span><b>${esc(e.title)}</b><small class="${e.date<Core.today()?'danger':''}">${e.date<Core.today()?'Vencida · ':''}${shortDate(e.date)}</small></span><strong>${money(e.amount)}</strong>${icon('arrow')}</button>`).join('')}</div>`}

 if(d.action==='copy-budget'){const prev=moveMonth(finMonth,-1),source=state.finance.budgets[prev];if(!source||!Object.keys(source).length){toast('Não há orçamento no mês anterior.');return}if(Object.keys(state.finance.budgets[finMonth]||{}).length&&!confirm('Substituir os limites deste mês pelos do mês anterior?'))return;state.finance.budgets[finMonth]={...source};save();render();toast('Orçamento copiado. Você pode ajustar os limites.')}
});

const originalRoutines=routines;
routines=function(){return `<p class="view-description">Rotinas são tarefas que se repetem. Use metas para registrar quantidades e acompanhar sua consistência; a conclusão da tarefa continua separada e vale XP.</p>${series().map(t=>{let key=t.seriesId||t.id,g=org().goals[key],s=g?Ext.stats(state,key):null,n=g?Ext.total(state,key,Core.today()):0;return `<section class="card habit-card"><div class="row">${cat('mochi','smallcat')}<h2 class="grow">${esc(t.title)}</h2></div>${g?`<p><b>${n.toLocaleString('pt-BR')} / ${g.target.toLocaleString('pt-BR')}</b> ${esc(g.unit)} por ${periodNames[g.period]}</p><progress value="${Math.min(n,g.target)}" max="${g.target}"></progress><p class="muted">Sequência: ${s.current} · Recorde: ${s.best} ${periodNames[g.period]}(s)</p>`:routineTrail(t)}<div class="row wrap">${extButton('routine-goal','Definir meta',t.id)}${g?extButton('activity','Registrar',t.id)+extButton('activity-history','Registros',t.id)+(g.unit.toLowerCase().startsWith('min')?extButton('routine-timer','Cronometrar',t.id):''):''}${extButton('task','Editar tarefa',t.id)}</div></section>`}).join('')||empty('Uma rotina de cada vez','Crie uma tarefa recorrente ou escolha um modelo.','yuki')}<div class="section row"><h2>Novos começos</h2>${extButton('quit','Adicionar')}</div><p class="muted">Acompanhe o tempo desde que deixou um hábito.</p>${org().quits.map(q=>`<div class="card"><h3>${esc(q.title)}</h3><p class="big">${Math.floor((Date.now()-q.since)/86400000)} dias</p><small>Desde ${new Date(q.since).toLocaleDateString('pt-BR')}</small><div class="row">${extButton('quit-reset','Novo começo',q.id)}${extButton('quit-delete','Excluir',q.id)}</div></div>`).join('')}`};
function routineGoalForm(id){let t=state.tasks.find(t=>t.id===id),key=t.seriesId||t.id,g=org().goals[key]||{target:1,unit:'vez',period:t.repeat};modal('Meta · '+esc(t.title),`<form data-form="ext-goal" data-id="${esc(key)}">${formField('Quantidade','target',g.target,'number','min="0.001" max="1000000000" step="any" required')}${formField('Unidade (páginas, minutos, copos…)','unit',g.unit,'text','required maxlength="30"')}${selectField('Período da meta','period',Ext.periods.map(p=>[p,'Por '+periodNames[p]]),g.period)}<p class="footnote">A meta mede sua atividade. A recorrência da tarefa pode ser ajustada em Editar tarefa. Alterar a meta recalcula as estatísticas, preservando os registros.</p><button class="primary wide">Salvar meta</button></form>`)}
function activityForm(id){let t=state.tasks.find(t=>t.id===id),key=t.seriesId||t.id,g=org().goals[key];modal('Registrar · '+esc(t.title),`<form data-form="ext-log" data-id="${esc(key)}">${formField('Quantidade em '+g.unit,'amount',1,'number','min="0.001" max="1000000000" step="any" required')}${formField('Data','date',Core.today(),'date',`required max="${Core.today()}"`)}${formField('Nota (opcional)','note','','text','maxlength="2000"')}<p class="footnote">Registros alimentam a meta e as sequências. Não geram XP: conclua a tarefa quando terminar.</p><button class="primary wide">Registrar atividade</button></form>`)}
function activityHistory(id){let t=state.tasks.find(t=>t.id===id),key=t.seriesId||t.id;modal('Registros · '+esc(t.title),org().logs.filter(l=>l.key===key).sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<div class="card"><div class="row"><b class="grow">${l.amount} · ${shortDate(l.date)}</b>${extButton('log-delete','Excluir',l.id)}</div><p>${esc(l.note)}</p></div>`).join('')||'<p>Nenhuma atividade registrada.</p>')}
function safeNote(s){return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/_([^_]+)_/g,'<em>$1</em>').replace(/\n/g,'<br>')}
function journal(){return head('SEU ESPAÇO DE REFLEXÃO','Diário')+`<div class="row"><button data-action="note-favorites" class="quiet" aria-pressed="${onlyFavorites}">${onlyFavorites?'★ Favoritas':'☆ Todas'}</button></div><label for="noteChoice">Filtrar por rotina</label><select id="noteChoice"><option value="all">Todas as notas</option>${organizerOptions().map(([k,v])=>`<option value="${esc(k)}" ${noteChoice===k?'selected':''}>${esc(v)}</option>`).join('')}</select>${org().notes.filter(n=>(noteChoice==='all'||n.key===noteChoice)&&(!onlyFavorites||n.favorite)).sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<article class="card journal-note"><small>${shortDate(n.date)}</small><h2>${esc(n.title)}</h2><div>${safeNote(n.text)}</div><div class="row">${extButton('note', 'Editar',n.id)}${extButton('note-star',n.favorite?'★ Favorita':'☆ Favoritar',n.id)}${extButton('note-delete','Excluir',n.id)}</div></article>`).join('')||''}`}
function noteForm(id){let n=org().notes.find(n=>n.id===id)||{title:'',text:'',key:'',date:Core.today()};modal('Meu diário',`<form data-form="ext-note" data-id="${esc(id||'')}">${formField('Título','title',n.title,'text','required maxlength="150"')}${formField('Data','date',n.date,'date','required')}${selectField('Rotina associada','key',organizerOptions(),n.key)}<label for="note-text">Reflexão</label><div class="row">${extButton('note-bold','Negrito')}${extButton('note-italic','Itálico')}</div><textarea id="note-text" name="text" maxlength="10000" rows="7" required>${esc(n.text)}</textarea><p class="footnote">Use **negrito** e _itálico_ para destacar trechos.</p><div id="note-preview" class="note-preview">${safeNote(n.text)}</div><button class="primary wide">Salvar nota</button></form>`)}
const originalMore=more;more=()=>originalMore()+`<button class="menu-item" data-page="journal">Diário e reflexões ${icon('arrow')}</button>`;
function reminderForm(id){let r=org().reminders.find(x=>x.id===id)||{title:'',date:Core.today(),time:'09:00',repeat:'once'};modal('Lembrete',`<form data-form="ext-reminder" data-id="${esc(id||'')}">${formField('Título','title',r.title,'text','required maxlength="150"')}${formField('Data inicial','date',r.date,'date','required')}${formField('Horário','time',r.time,'time','required')}${selectField('Repetir','repeat',[['once','Uma vez'],['daily','Diariamente'],['weekly','Semanalmente'],['monthly','Mensalmente']],r.repeat)}<p class="footnote">Avisos funcionam enquanto o aplicativo está aberto. Exporte para o calendário do celular para receber lembretes em segundo plano. Mensais no dia 31 só ocorrem em meses com esse dia.</p><button class="primary wide">Salvar lembrete</button></form>`)}
const originalCalendar=calendar;
calendar=function(){let days=agendaMode==='week'?Array.from({length:7},(_,i)=>Core.addDays(Ext.period(day,'weekly'),i)):[day];return `<div class="tabs">${[['day','Dia'],['week','Semana'],['month','Mês']].map(([v,n])=>`<button data-action="agenda-mode" data-id="${v}" class="${agendaMode===v?'selected':''}">${n}</button>`).join('')}</div>${agendaMode==='month'?originalCalendar():`<label for="agendaDate">Data de referência</label><input id="agendaDate" type="date" value="${day}">${days.map(d=>`<div class="section"><h3>${shortDate(d)}</h3>${taskList(state.tasks.filter(t=>t.date===d&&!t.archived))}</div>`).join('')}`}<div class="section row"><h2>Lembretes</h2>${extButton('reminder','+ Novo')}</div><p class="footnote">${agendaMode==='week'?'Nesta semana':'Em '+shortDate(day)} · horários do dispositivo</p>${org().reminders.filter(r=>days.some(d=>Ext.due(r,d))).map(r=>`<div class="card row"><div class="grow"><b>${esc(r.title)}</b><p>${r.time} · ${{once:'Uma vez',daily:'Diário',weekly:'Semanal',monthly:'Mensal'}[r.repeat]}</p></div>${extButton('reminder','Editar',r.id)}</div>`).join('')||'<p class="muted">Nenhum lembrete neste período.</p>'}<div class="row wrap">${extButton('reminders','Todos os lembretes')}${extButton('export-calendar','Exportar calendário')}</div>`};
function allReminders(){modal('Todos os lembretes',`<p class="footnote">Avisos locais enquanto o NekoQuest estiver aberto. Ao reabrir, serão mostrados lembretes pendentes do dia.</p>${extButton('notify-permission','Ativar notificações')}${org().reminders.map(r=>`<div class="card"><b>${esc(r.title)}</b><p>${shortDate(r.date)} · ${r.time}</p><div class="row wrap">${extButton('reminder','Editar',r.id)}${extButton('reminder-toggle',r.enabled?'Pausar':'Ativar',r.id)}${extButton('reminder-delete','Excluir',r.id)}</div></div>`).join('')}`)}
function quitForm(){modal('Um novo começo',`<form data-form="ext-quit">${formField('Hábito que você deixou','title','','text','required maxlength="100"')}${formField('Desde quando','date',Core.today(),'date',`required max="${Core.today()}"`)}<button class="primary wide">Acompanhar marco</button></form>`)}
function extSubmit(type,v,id){let o=org();if(type==='ext-list'){if(!v.title.trim())throw Error('Informe um nome.');o.lists.push({id:Core.id(),title:v.title.trim()})}if(type==='ext-goal'){let target=Number(v.target);if(!Number.isFinite(target)||target<=0||target>1e9||!v.unit.trim()||!Ext.periods.includes(v.period))throw Error('Confira a meta.');o.goals[id]={target,unit:v.unit.trim(),period:v.period}}
 if(type==='ext-log'){let amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0||amount>1e9||!Core.validDate(v.date)||v.date>Core.today())throw Error('Confira quantidade e data.');o.logs.push({...v,amount,key:id,id:Core.id()})}
 if(type==='ext-note'){if(!v.title.trim()||!v.text.trim()||!Core.validDate(v.date))throw Error('Confira a nota.');let n=o.notes.find(x=>x.id===id);if(n)Object.assign(n,v);else o.notes.push({...v,id:Core.id(),favorite:false})}
 if(type==='ext-reminder'){if(!v.title.trim()||!Core.validDate(v.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))throw Error('Confira título, data e horário.');let r=o.reminders.find(x=>x.id===id);if(r)Object.assign(r,v,{lastFired:null});else o.reminders.push({...v,id:Core.id(),enabled:true})}
 if(type==='ext-quit'){if(!v.title.trim()||!Core.validDate(v.date)||v.date>Core.today())throw Error('Confira nome e data.');o.quits.push({id:Core.id(),title:v.title.trim(),since:new Date(v.date+'T00:00').getTime()})}}
document.addEventListener('click',async e=>{let d=e.target.closest('button')?.dataset;if(!d)return;let a=d.action,o=org();try{
 if(a==='lists')listManager();if(a==='list-rename'){let l=o.lists.find(x=>x.id===d.id),name=prompt('Nome da lista',l.title);if(name?.trim()){l.title=name.trim().slice(0,100);save();render();listManager()}}
 if(a==='list-delete'&&confirm('Excluir a lista? As tarefas serão mantidas.')){o.lists=o.lists.filter(x=>x.id!==d.id);state.tasks.forEach(t=>{if(t.listId===d.id)t.listId=''});listChoice='all';save();render();listManager()}
 if(a==='routine-timer')routineStopwatch(d.id);if(a==='watch-start'){let w=o.stopwatch;w.startedAt=Date.now();save();routineStopwatch(w.taskId)}if(a==='watch-pause'){let w=o.stopwatch;w.elapsed+=Date.now()-w.startedAt;w.startedAt=null;save();routineStopwatch(w.taskId)}if(a==='watch-log'){let w=o.stopwatch,minutes=(w.elapsed+(w.startedAt?Date.now()-w.startedAt:0))/60000;if(minutes<0.001){toast('Inicie o cronômetro antes de registrar.');return}w.elapsed=minutes*60000;w.startedAt=null;save();activityForm(w.taskId);$('#modal [name=amount]').value=Math.round(minutes*1000)/1000;$('#modal form').dataset.stopwatch='true'}if(a==='watch-reset'&&confirm('Zerar o cronômetro sem registrar?')){o.stopwatch={taskId:d.id,elapsed:0,startedAt:null};save();routineStopwatch(d.id)}
 if(a==='routine-goal')routineGoalForm(d.id);if(a==='activity')activityForm(d.id);if(a==='activity-history')activityHistory(d.id);
 if(a==='log-delete'&&confirm('Excluir o registro e recalcular a sequência?')){o.logs=o.logs.filter(x=>x.id!==d.id);save();$('#modal').close();render()}
 if(a==='note')noteForm(d.id);if(a==='note-favorites'){onlyFavorites=!onlyFavorites;render()}
 if(a==='note-star'){let n=o.notes.find(x=>x.id===d.id);n.favorite=!n.favorite;save();render()}
 if(a==='note-delete'&&confirm('Excluir esta nota?')){o.notes=o.notes.filter(x=>x.id!==d.id);save();render()}
 if(a==='note-bold'||a==='note-italic'){let el=$('#note-text'),mark=a==='note-bold'?'**':'_',i=el.selectionStart,j=el.selectionEnd;el.setRangeText(mark+el.value.slice(i,j)+mark,i,j,'select');el.focus();$('#note-preview').innerHTML=safeNote(el.value)}
 if(a==='quit')quitForm();if(a==='quit-reset'&&confirm('Reiniciar a contagem a partir de agora?')){o.quits.find(x=>x.id===d.id).since=Date.now();save();render()}
 if(a==='quit-delete'&&confirm('Excluir este marco?')){o.quits=o.quits.filter(x=>x.id!==d.id);save();render()}
 if(a==='agenda-mode'){agendaMode=d.id;render()}if(a==='reminder')reminderForm(d.id);if(a==='reminders')allReminders();
 if(a==='reminder-toggle'){let r=o.reminders.find(x=>x.id===d.id);r.enabled=!r.enabled;save();render();allReminders()}
 if(a==='reminder-delete'&&confirm('Excluir lembrete?')){o.reminders=o.reminders.filter(x=>x.id!==d.id);save();render();allReminders()}
 if(a==='notify-permission')await authorizeModernNotifications();
 if(a==='export-calendar'){if(!o.reminders.some(r=>r.enabled)){toast('Crie ou ative um lembrete primeiro.');return}let url=URL.createObjectURL(new Blob([Ext.ics(o.reminders)],{type:'text/calendar;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='nekoquest-agenda.ics';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Importe o arquivo no calendário e confira os alertas. Reimportações podem duplicar eventos.')}
 }catch(err){showIssue(err.message)}});
document.addEventListener('change',e=>{if(e.target.id==='listChoice'){listChoice=e.target.value;render()}if(e.target.id==='noteChoice'){noteChoice=e.target.value;render()}if(e.target.id==='agendaDate'&&Core.validDate(e.target.value)){day=e.target.value;calMonth=day.slice(0,7);render()}});
