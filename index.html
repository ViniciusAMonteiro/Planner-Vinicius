<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf9f6" />
    <title>Planner</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf9f6;
        --surface: #fffefa;
        --text: #262b28;
        --muted: #626862;
        --line: #d8dcd5;
        --accent: #3c6555;
        --on-accent: #fff;
        --soft: #edf1eb;
        --s1: 4px;
        --s2: 8px;
        --s3: 16px;
        --s4: 24px;
        --s5: 32px;
        --s6: 48px;
        --radius: 12px;
        --small: 14px;
        --body: 16px;
        --heading: 24px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191b19;
          --surface: #202320;
          --text: #efeee8;
          --muted: #b1b7ae;
          --line: #454c44;
          --accent: #b1d2bc;
          --on-accent: #192b20;
          --soft: #2b322c;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: var(--body);
        line-height: 1.6;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea,
      summary {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      summary,
      input,
      select,
      textarea {
        min-height: 44px;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 44px;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        cursor: pointer;
        transition:
          background 180ms,
          color 180ms,
          border-color 180ms;
        font-weight: 400;
      }
      button:hover {
        background: var(--soft);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.primary {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      button.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }
      button.selected,
      .tabs .selected,
      .chips .selected {
        color: var(--accent);
        border-color: var(--accent);
        background: var(--soft);
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
      }
      main:focus {
        outline: none;
      }
      a {
        color: var(--accent);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0 0 16px;
      }
      h1 {
        font-size: var(--heading);
        line-height: 1.3;
        font-weight: 600;
        margin-bottom: 32px;
        letter-spacing: -0.025em;
      }
      h2,
      h3 {
        font-size: var(--body);
        line-height: 1.5;
        font-weight: 600;
      }
      strong,
      b {
        font-weight: 600;
      }
      small,
      .small,
      .footnote,
      .muted,
      .view-description {
        color: var(--muted);
        font-size: var(--small);
      }
      .footnote {
        margin-top: 16px;
      }
      .icon {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      .shell {
        max-width: 800px;
        margin: auto;
      }
      #header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 24px;
        margin-bottom: 16px;
        gap: 16px;
      }
      #header .brand {
        font-weight: 600;
      }
      #header .muted {
        font-size: 14px;
      }
      main {
        padding: 8px 24px 160px;
        min-height: 70vh;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        width: min(100%, 800px);
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
        z-index: 5;
      }
      nav button {
        flex: 1;
        min-height: 60px;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
        color: var(--muted);
        border: 0;
        background: transparent;
      }
      nav button.active {
        color: var(--accent);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .section {
        margin-top: 32px;
        margin-bottom: 16px;
      }
      .card,
      .stat {
        padding: 24px 0;
        margin: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .stat strong {
        font-size: 24px;
        display: block;
      }
      .stat small {
        display: block;
      }
      .wide {
        width: 100%;
        margin: 8px 0;
      }
      .center {
        text-align: center;
      }
      .empty {
        padding: 32px 0;
        color: var(--muted);
        font-size: 14px;
      }
      .area-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0 24px;
      }
      .area-tile {
        border: 0;
        border-radius: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        min-height: 80px;
        justify-content: flex-start;
        padding: 16px 0;
        text-align: left;
      }
      .area-tile span {
        flex: 1;
      }
      .area-tile > .icon:last-child {
        width: 16px;
        color: var(--muted);
      }
      .date-label {
        margin-bottom: 16px;
      }
      .home-status {
        font-size: 24px;
        line-height: 1.5;
        max-width: 28ch;
        margin-bottom: 48px;
        letter-spacing: -0.025em;
      }
      .home-list {
        margin: 32px 0;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .summary-row span:last-child {
        text-align: right;
      }
      .tabs,
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 0 16px;
        scrollbar-width: thin;
        margin-bottom: 8px;
      }
      .tabs button,
      .chips button {
        white-space: nowrap;
        font-size: 14px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0;
      }
      .search input {
        flex: 1;
      }
      .search > .icon {
        color: var(--muted);
      }
      label {
        display: block;
        font-size: 14px;
        margin: 16px 0 8px;
      }
      input,
      select,
      textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        background: var(--surface);
        padding: 8px 12px;
        border-radius: 8px;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      textarea {
        min-height: 112px;
        resize: vertical;
      }
      input[type="checkbox"] {
        width: 24px;
        height: 24px;
        min-height: 24px;
        flex-shrink: 0;
        accent-color: var(--accent);
      }
      input[type="range"] {
        accent-color: var(--accent);
      }
      .checklabel {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        margin-top: 0;
      }
      .filters,
      details {
        margin: 16px 0;
      }
      summary {
        cursor: pointer;
        display: list-item;
        padding: 8px 0;
        color: var(--muted);
        font-size: 14px;
      }
      details[open] > summary {
        margin-bottom: 16px;
      }
      form {
        margin: 16px 0;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        min-width: 0;
      }
      legend {
        font-size: 14px;
      }
      .task,
      .entry {
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding: 16px 0;
      }
      .task-body,
      .entry-body {
        border: 0;
        background: transparent;
        display: block;
        text-align: left;
        padding: 4px 8px;
        overflow-wrap: anywhere;
      }
      .title,
      .entry-body b {
        display: block;
      }
      .task small,
      .entry small {
        display: block;
        font-size: 14px;
      }
      .task .check {
        border: 0;
        background: transparent;
        padding: 8px;
        color: var(--accent);
      }
      .task.done .title {
        text-decoration: line-through;
        color: var(--muted);
      }
      .task-group-title {
        display: flex;
        justify-content: space-between;
        margin: 32px 0 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .task-group-title span {
        display: none;
      }
      .entry-end {
        display: flex;
        align-items: flex-end;
        flex-direction: column;
        gap: 4px;
        text-align: right;
        font-size: 14px;
      }
      .fab {
        position: fixed;
        bottom: calc(100px + env(safe-area-inset-bottom));
        right: max(24px, calc((100vw - 752px) / 2));
        width: 56px;
        height: 56px;
        border-radius: 50%;
        z-index: 4;
      }
      .icon-btn {
        padding: 8px;
      }
      .calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(44px, 1fr));
        overflow-x: auto;
        gap: 4px;
        margin: 16px 0;
        text-align: center;
      }
      .calendar small {
        padding: 8px;
      }
      .calendar button {
        padding: 8px 0;
        background: transparent;
        border-color: transparent;
        position: relative;
      }
      .calendar .selected {
        border-color: var(--accent);
        color: var(--accent);
      }
      .calendar .dot:after {
        content: "";
        width: 4px;
        height: 4px;
        background: var(--accent);
        border-radius: 50%;
        position: absolute;
        bottom: 3px;
        left: calc(50% - 2px);
      }
      dialog {
        width: min(560px, calc(100% - 32px));
        max-height: calc(100dvh - 48px);
        padding: 24px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        border-radius: 16px;
        overflow: auto;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.35);
      }
      .dialog-heading {
        margin-bottom: 24px;
      }
      .dialog-heading h2 {
        margin: 0;
      }
      .detail-notes {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .detail-subtasks button {
        width: 100%;
        justify-content: flex-start;
        margin: 4px 0;
      }
      .timer {
        text-align: center;
        padding: 48px 0;
      }
      .timer strong,
      .big,
      .money {
        font-size: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .timer strong {
        display: block;
        letter-spacing: 0.08em;
      }
      .timer small {
        display: block;
      }
      .timer .sprite {
        display: none;
      }
      .focus-context {
        margin-top: 24px;
      }
      .eyebrow {
        font-size: 14px;
        color: var(--muted);
      }
      .week {
        display: flex;
        justify-content: space-between;
        margin: 16px 0;
      }
      .week span {
        font-size: 14px;
        text-align: center;
        color: var(--muted);
      }
      .week b {
        display: block;
      }
      .week .hit {
        color: var(--accent);
      }
      progress {
        width: 100%;
        height: 8px;
        accent-color: var(--accent);
        border-radius: 4px;
        display: block;
        margin: 16px 0;
      }
      .bar,
      .spending-track {
        height: 8px;
        display: flex;
        background: var(--line);
        overflow: hidden;
        margin: 16px 0;
      }
      .bar i {
        height: 100%;
        display: block;
        background: var(--accent);
      }
      .spending-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 0;
        font-size: 14px;
      }
      .spending-row span {
        flex: 1;
      }
      .spending-row span i {
        display: none;
      }
      .balance-grid {
        margin-top: 24px;
      }
      .balance-grid b {
        display: block;
      }
      .money {
        margin: 16px 0;
      }
      .water-quick {
        display: flex;
        gap: 8px;
      }
      .water-quick button {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .water-chart {
        height: 180px;
        display: flex;
        gap: 4px;
      }
      .water-chart button {
        flex: 1;
        min-width: 0;
        flex-direction: column;
        border: 0;
        background: transparent;
        padding: 0;
      }
      .water-chart span {
        height: 100px;
        width: 12px;
        display: flex;
        align-items: flex-end;
      }
      .water-chart i {
        background: var(--accent);
        width: 100%;
        min-height: 2px;
      }
      .water-record small {
        display: block;
      }
      .food-check {
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
      }
      .food-check span span,
      .food-check span b,
      .food-check span small {
        display: block;
      }
      .food-entry {
        padding: 16px 0;
      }
      .food-entry small {
        display: block;
      }
      .workout-set {
        display: grid;
        gap: 8px;
        grid-template-columns: 24px 1fr 1fr 44px;
        align-items: center;
        margin: 8px 0;
      }
      .workout-chart {
        width: 100%;
        max-height: 200px;
      }
      .workout-set input {
        min-width: 0;
      }
      .workout-active-title {
        margin-top: 24px;
      }
      .workout-rest,
      .focus-finished {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin: 16px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid var(--line);
      }
      .form-error {
        border-left: 2px solid var(--accent);
        padding: 8px 16px;
        color: var(--text);
      }
      #toast {
        position: fixed;
        bottom: calc(96px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100% - 32px);
        padding: 12px 16px;
        background: var(--text);
        color: var(--bg);
        border-radius: 8px;
        z-index: 20;
        font-size: 14px;
      }
      #toast[hidden] {
        display: none;
      }
      body[data-density="compact"] .task,
      body[data-density="compact"] .entry {
        padding: 8px 0;
      }
      body[data-density="compact"] .card {
        padding: 16px 0;
      }
      .template-option {
        width: 100%;
        justify-content: space-between;
        text-align: left;
        margin: 8px 0;
      }
      .template-option b,
      .template-option small {
        display: block;
      }
      .journal-note .row {
        flex-wrap: wrap;
      }
      .workout-chart circle {
        fill: var(--accent);
      }
      @media (max-width: 480px) {
        .area-grid {
          grid-template-columns: 1fr;
        }
        .area-tile {
          min-height: 64px;
        }
        .grid {
          gap: 8px;
        }
        .card {
          padding: 16px 0;
        }
        .row {
          flex-wrap: wrap;
        }
        .task,
        .entry,
        .dialog-heading {
          flex-wrap: nowrap;
        }
        #header {
          padding: 24px;
        }
        .summary-row {
          font-size: 14px;
        }
        .workout-set {
          grid-template-columns: 20px 1fr 1fr 44px;
        }
        .workout-set label {
          font-size: 14px;
        }
        .entry-end {
          max-width: 45%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          transition: none !important;
          animation: none !important;
          scroll-behavior: auto !important;
        }
      }
      .set-row,
      .set-labels {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr) 44px;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }
      .set-labels {
        font-size: 14px;
        color: var(--muted);
      }
      .set-row input {
        min-width: 0;
        padding: 8px;
      }
      .previous-set {
        display: block;
        margin: 0 0 16px 36px;
      }
      .set-done > span {
        color: var(--accent);
      }
      .workout-session-head {
        margin-bottom: 24px;
      }
      .list-toolbar {
        margin-bottom: 16px;
      }
      .list-toolbar select {
        flex: 1;
      }
      .bar i,
      .spending-track i {
        background: var(--accent) !important;
      }
      :root {
        --control: #7a8378;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --control: #7f887b;
        }
      }
      input,
      select,
      textarea {
        border-color: var(--control);
      }
      button:not(.quiet):not(.area-tile):not(.task-body):not(.entry-body):not(
          .check
        ):not(.calendar button):not(nav button) {
        border-color: var(--control);
      }
      button.primary,
      button.selected {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header id="header"></header>
      <main id="app" tabindex="-1"></main>
      <nav id="nav" aria-label="Navegação principal"></nav>
    </div>
    <dialog id="modal" aria-labelledby="dialog-title"></dialog>
    <div id="toast" role="status" hidden></div>
    <script>
      /* Compatibility layer: retain the v4 storage shape and legacy metadata. */
      const Core = (() => {
        const cats = ["luna", "mochi", "mikan", "nori", "yuki", "sora"];
        const date = (d) =>
          `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        const today = () => date(new Date());
        const id = () =>
          globalThis.crypto?.randomUUID?.() ||
          Date.now().toString(36) + Math.random().toString(36).slice(2);
        const validDate = (s) =>
          typeof s === "string" &&
          /^\d{4}-\d{2}-\d{2}$/.test(s) &&
          date(new Date(s + "T12:00:00")) === s;
        function addDays(s, n) {
          let d = new Date(s + "T12:00");
          d.setDate(d.getDate() + n);
          return date(d);
        }
        function nextDate(s, repeat, anchor) {
          if (repeat === "daily") return addDays(s, 1);
          if (repeat === "weekly") return addDays(s, 7);
          if (repeat === "yearly") {
            let d = new Date(s + "T12:00"),
              m = d.getMonth(),
              day = d.getDate();
            d.setDate(1);
            d.setFullYear(d.getFullYear() + 1);
            d.setDate(
              Math.min(day, new Date(d.getFullYear(), m + 1, 0).getDate()),
            );
            return date(d);
          }
          let d = new Date(s + "T12:00"),
            day = anchor || d.getDate();
          d.setDate(1);
          d.setMonth(d.getMonth() + 1);
          d.setDate(
            Math.min(
              day,
              new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(),
            ),
          );
          return date(d);
        }
        function cents(value) {
          let s = String(value)
            .trim()
            .replace(/\s|R\$/g, "");
          if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
          if (!/^\d+(\.\d{1,2})?$/.test(s))
            throw Error("Digite um valor como 125,90.");
          let [a, b = ""] = s.split("."),
            n = Number(a) * 100 + Number(b.padEnd(2, "0"));
          if (!Number.isSafeInteger(n) || n > 99999999999)
            throw Error("Valor muito alto.");
          return n;
        }
        const defaults = () => ({
          version: 4,
          name: "Aventureiro",
          theme: "light",
          color: "#91c4a8",
          cat: "luna",
          tasks: [],
          coins: 0,
          xpTotal: 0,
          rewards: [],
          history: [],
          sessions: [],
          habits: [],
          finance: { entries: [], budgets: {}, goals: [], opening: 0 },
          timer: { mode: "focus", remaining: 1500, end: null },
          focus: 25,
          break: 5,
          preferences: {
            hideMoney: false,
            scene: "garden",
            motion: true,
            sounds: false,
            soundVolume: 0.35,
            alerts: false,
          },
        });
        function migrate(old) {
          let s = Object.assign(defaults(), old || {});
          s.version = 4;
          s.preferences = {
            hideMoney: !!s.preferences?.hideMoney,
            scene: ["garden", "sunset", "rain"].includes(s.preferences?.scene)
              ? s.preferences.scene
              : "garden",
            motion: s.preferences?.motion !== false,
            sounds: s.preferences?.sounds === true,

                `<button data-action="task-filter" data-value="${v}" class="${v === taskFilter ? "selected" : ""}" aria-pressed="${v === taskFilter}">${n}</button>`,
            )
            .join(
              "",
            )}</div><details class="filters"><summary>Listas e filtros</summary><div class="row list-toolbar"><select id="listChoice" aria-label="Filtrar lista"><option value="all">Todas as listas</option><option value="" ${listChoice === "" ? "selected" : ""}>Sem lista</option>${org()
            .lists.map(
              (l) =>
                `<option value="${esc(l.id)}" ${listChoice === l.id ? "selected" : ""}>${esc(l.title)}</option>`,
            )
            .join(
              "",
            )}</select>${extButton("lists", "Editar listas")}</div><div class="grid"><select id="categoryFilter" aria-label="Categoria"><option value="all">Todas as categorias</option>${["Estudos", "Trabalho", "Saúde", "Pessoal"].map((c) => `<option ${categoryFilter === c ? "selected" : ""}>${c}</option>`).join("")}</select><select id="taskSort" aria-label="Ordenação"><option value="date" ${sort === "date" ? "selected" : ""}>Por data</option><option value="priority" ${sort === "priority" ? "selected" : ""}>Por prioridade</option></select></div></details><div id="task-results">${taskGroups(filteredTasks())}</div><button class="quiet wide" data-action="templates">Modelos de tarefa</button>`
        );
      }

      function monthCalendar() {
        let d = new Date(calMonth + "-01T12:00"),
          count = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        return (
          monthSwitch(calMonth, "calendar-month") +
          `<div class="calendar">${["D", "S", "T", "Q", "Q", "S", "S"].map((c) => `<small>${c}</small>`).join("")}${"<span></span>".repeat(d.getDay())}${Array.from(
            { length: count },
            (_, i) => {
              let dt = calMonth + "-" + String(i + 1).padStart(2, "0");
              return `<button data-action="day" data-value="${dt}" class="${dt === day ? "selected" : ""} ${state.tasks.some((t) => t.date === dt && !t.archived) ? "dot" : ""}" aria-label="${shortDate(dt)}">${i + 1}</button>`;
            },
          ).join(
            "",
          )}</div><div class="section row"><h2>${shortDate(day)}</h2><button class="quiet" data-action="calendar-today">Voltar para hoje</button></div>${taskList(state.tasks.filter((t) => t.date === day && !t.archived))}`
        );
      }

      function focus() {
        const target = state.tasks.find((t) => t.id === state.focusTask),
          last = state.lastFocus,
          canFinish =
            last?.taskId &&
            state.tasks.some((t) => t.id === last.taskId && !t.done);
        return (
          head("UMA COISA DE CADA VEZ", "Hora do foco") +
          `${last ? `<div class="focus-finished"><div class="row"><b>${icon("check")} Sessão concluída</b><button class="quiet icon-btn" data-action="dismiss-focus" aria-label="Fechar resumo da sessão">${icon("close")}</button></div><p>${esc(last.title)}</p>${canFinish ? `<button class="wide" data-action="finish-focused-task" data-id="${esc(last.taskId)}">Concluir esta tarefa</button>` : "<small>Sessão registrada.</small>"}</div>` : ""}<div class="focus-context"><span class="eyebrow">${state.timer.mode === "focus" ? "TAREFA EM FOCO" : "HORA DE RESPIRAR"}</span><h2>${esc(state.timer.taskTitle || target?.title || "Foco livre")}</h2></div><div class="timer"><strong id="clock">25:00</strong><small>${state.timer.mode === "focus" ? "FOCO" : "PAUSA"}</small></div><div class="row">${btn("timer-reset", icon("reset"), "icon-btn")}${btn("timer", icon(state.timer.end ? "pause" : "play") + (state.timer.end ? "Pausar" : state.timer.startedAt ? "Continuar" : "Começar"), "primary grow")}${btn("timer-mode", state.timer.mode === "focus" ? "Pausa" : "Foco")}</div><div class="card"><label for="focusTask">Escolher tarefa</label><select id="focusTask" ${state.timer.startedAt ? "disabled" : ""}><option value="">Foco livre</option>${state.tasks
            .filter((t) => !t.done && t.date <= Core.today())
            .map(
              (t) =>
                `<option value="${esc(t.id)}" ${state.focusTask === t.id ? "selected" : ""}>${esc(t.title)}</option>`,
            )
            .join(
              "",
            )}</select><details class="focus-settings"><summary>Ajustar duração · ${state.focus} / ${state.break} min</summary><form data-form="timer"><div class="grid">${formField("Foco (min)", "focus", state.focus, "number", 'min="1" max="180" required')}${formField("Pausa (min)", "break", state.break, "number", 'min="1" max="60" required')}</div><button class="wide">Salvar duração</button></form></details></div><p class="center muted">${state.sessions.length} sessões concluídas</p>`
        );
      }

      function entryList(entries) {
        return entries.length
          ? entries
              .slice()
              .sort((a, b) => b.date.localeCompare(a.date))
              .map(
                (e) =>
                  `<article class="entry"><button class="entry-body grow" data-action="entry" data-id="${esc(e.id)}"><b>${esc(e.title)}</b><small>${esc(e.category)} · ${shortDate(e.date)} · ${e.paid ? "Efetivado" : e.date < Core.today() ? "Vencido" : "Pendente"}</small></button><div class="entry-end"><b>${e.type === "income" ? "+" : "−"} ${money(e.amount)}</b>${!e.paid ? `<button class="quiet" data-action="settle" data-id="${esc(e.id)}">${e.type === "income" ? "Receber" : "Pagar"}</button>` : ""}</div></article>`,
              )
              .join("")
          : empty();
      }

      function finances() {
        let f = Core.finance(state, finMonth),
          budget = state.finance.budgets[finMonth] || {},
          totalBudget = Object.values(budget).reduce((a, b) => a + b, 0);
        let html =
          `<div class="row"><div>${head("UM FUTURO MAIS TRANQUILO", "Finanças")}</div><button class="privacy-button icon-btn" data-action="privacy" aria-label="${state.preferences.hideMoney ? "Mostrar valores" : "Ocultar valores"}" aria-pressed="${state.preferences.hideMoney}">${state.preferences.hideMoney ? "◌" : "◉"}</button></div>` +
          monthSwitch(finMonth, "finance-month") +
          `<div class="tabs finance-tabs" role="group" aria-label="Seções de finanças">${[
            ["overview", "Resumo"],
            ["entries", "Lançamentos"],
            ["budget", "Orçamento"],
            ["goals", "Metas"],
            ["reports", "Relatórios"],
            ["calendar", "Agenda"],
          ]
            .map(
              ([v, n]) =>
                `<button class="${finTab === v ? "selected" : ""}" data-action="finance-tab" data-value="${v}" aria-pressed="${finTab === v}">${n}</button>`,
            )
            .join("")}</div>`;
        if (finMonth !== Core.today().slice(0, 7))
          html +=
            '<button class="quiet wide month-return" data-action="finance-now">Voltar ao mês atual</button>';
        if (finTab === "overview") {
          html += `<div class="card finance-hero"><small>Saldo acumulado</small><div class="money">${money(f.balance)}</div><div class="grid balance-grid"><div><small>↓ Recebido no mês</small><b class="positive">${money(f.income)}</b></div><div><small>↑ Pago no mês</small><b>${money(f.expense)}</b></div></div></div><div class="grid"><div class="card"><small>A pagar neste mês</small><p><b class="danger">${money(f.pending)}</b></p></div><div class="card"><small>A receber neste mês</small><p><b class="positive">${money(f.pendingIncome)}</b></p></div></div><div class="row section"><h2>Seu orçamento</h2></div><div class="card"><div class="row"><small>Despesas pagas + pendentes</small><b>${money(f.committed)}</b></div><div class="bar ${f.committed > totalBudget && totalBudget ? "over" : ""}"><i style="width:${totalBudget ? Math.min(100, (f.committed / totalBudget) * 100) : 0}%"></i></div><small>${totalBudget ? `Orçamento definido: ${money(totalBudget)}` : "Defina limites por categoria para acompanhar o mês."}</small></div>${financeAttentionPanel()}${spendingChart()}<div class="section row"><h2>Últimos lançamentos</h2></div>${entryList(
            f.entries
              .slice()
              .sort((a, b) => b.date.localeCompare(a.date))
              .slice(0, 4),
          )}`;
        }
        if (finTab === "entries") {
          html +=
            `<div class="search">${icon("search")}<input id="finance-search" aria-label="Buscar lançamento" placeholder="Buscar lançamento…" value="${esc(financeQuery)}"></div><div class="chips">${[
              ["all", "Todos"],
              ["pending", "Pendentes"],
              ["overdue", "Vencidos"],
              ["paid", "Efetivados"],
              ["expense", "Despesas"],
              ["income", "Receitas"],
            ]
              .map(
                ([v, n]) =>
                  `<button data-action="finance-filter" data-value="${v}" class="${financeFilter === v ? "selected" : ""}">${n}</button>`,
              )
              .join(
                "",
              )}</div><div id="finance-results">${financeEntryResults(f.entries)}</div>` +
            `<button class="wide" data-action="repeat-entries">Trazer recorrentes do mês anterior</button><p class="footnote">Copia os lançamentos marcados como mensais para este mês, como pendentes e sem duplicar.</p>`;
        }
        if (finTab === "budget") {
          html += `${categories
            .map((c) => {
              let spent = f.entries
                  .filter((e) => e.type === "expense" && e.category === c)
                  .reduce((a, e) => a + e.amount, 0),
                limit = budget[c] || 0;
              return `<div class="card"><div class="row"><b>${c}</b><small>${money(spent)} ${limit ? "/ " + money(limit) : ""}</small></div><div class="bar ${limit && spent > limit ? "over" : ""}"><i style="width:${limit ? Math.min(100, (spent / limit) * 100) : 0}%"></i></div><small class="${limit && spent > limit ? "danger" : ""}">${limit ? (spent > limit ? "Acima do limite em " + money(spent - limit) : "Disponível: " + money(limit - spent)) : "Sem limite definido"}</small></div>`;
            })
            .join(
              "",
            )}${btn("budget", "Editar orçamento do mês", "primary wide")}${btn("copy-budget", "Copiar limites do mês anterior", "wide")}`;
        }
        if (finTab === "goals") {
          html += `<p class="muted">Acompanhe o dinheiro que você já separou para seus planos.</p>${state.finance.goals.map((g) => `<div class="card"><div class="row"><div class="grow"><b>${esc(g.title)}</b><small style="display:block">${money(g.saved)} de ${money(g.target)}</small></div><button class="quiet icon-btn" data-action="goal" data-id="${esc(g.id)}" aria-label="Editar meta">${icon("edit")}</button></div><div class="bar"><i style="width:${Math.min(100, (g.saved / g.target) * 100)}%"></i></div><small>${g.saved >= g.target ? "Meta alcançada!" : Math.round((g.saved / g.target) * 100) + "% do caminho"}</small></div>`).join("") || empty("Um sonho de cada vez", "Crie uma meta e atualize o valor que já guardou.", "sora")}${btn("goal", icon("plus") + " Nova meta", "primary wide")}<p class="footnote">Metas são um acompanhamento separado; seus valores não alteram o saldo ou os lançamentos.</p>`;
        }
        if (finTab === "reports") html += financeReports();
        if (finTab === "calendar") html += financeCalendar();
        if (["overview", "entries"].includes(finTab))
          html += btn(
            "entry",
            icon("plus") + " Novo lançamento",
            "primary wide",
          );
        html += `<div class="row section">${btn("opening", "Saldo inicial", "quiet")}</div>`;
        return html;
      }
      function history() {
        const items = [
          ...state.history.filter((h) => ["task", "reopen"].includes(h.type)),
          ...state.sessions.map((s) => ({
            ...s,
            type: "focus",
            title: s.title || "Sessão de foco",
          })),
        ]
          .filter((h) => historyTab === "all" || h.type === historyTab)
          .sort((a, b) => b.at - a.at);
        return (
          head("", "Histórico") +
          `<div class="tabs">${[
            ["all", "Todos"],
            ["task", "Tarefas"],
            ["focus", "Foco"],
          ]
            .map(
              ([v, n]) =>
                `<button data-action="history-tab" data-value="${v}" class="${historyTab === v ? "selected" : ""}" aria-pressed="${historyTab === v}">${n}</button>`,
            )
            .join(
              "",
            )}</div>${items.map((h) => `<article class="entry"><div class="grow"><b>${esc(h.title)}</b><small>${new Date(h.at).toLocaleString("pt-BR")}</small></div><small>${h.type === "focus" ? (h.minutes || 0) + " min" : h.type === "reopen" ? "Reaberta" : h.reverted ? "Revertida" : "Concluída"}</small></article>`).join("") || empty()}`
        );
      }

      function profile() {
        return (
          head("", "Perfil") +
          `<form data-form="profile">${formField("Seu nome", "name", state.name === "Aventureiro" ? "" : state.name, "text", 'maxlength="40" autocomplete="given-name"')}<button class="primary">Salvar nome</button></form>${modernSettings()}<section class="section"><h2>Dados</h2>${btn("backup", icon("download", "Exportar") + " Exportar backup", "wide")}<label for="import">Restaurar backup JSON</label><input id="import" type="file" accept="application/json,.json"><p class="footnote">Dados salvos neste navegador. Ao mudar de aparelho ou de endereço, exporte e restaure seu backup.</p><p class="footnote">Um arquivo HTML independente. Abra o arquivo baixado para usar sem conexão. Avisos locais exigem o aplicativo aberto; para alertas com ele fechado, exporte os lembretes para seu calendário.</p></section>`
        );
      }
      function taskForm(id, preset = {}) {
        const t = state.tasks.find((t) => t.id === id) || {
          title: "",
          date: page === "calendar" ? day : Core.today(),
          category: "Pessoal",
          priority: "normal",
          minutes: 25,
          repeat: page === "habits" ? "daily" : "none",
          notes: "",
          subtasks: [],
          ...preset,
        };
        modal(
          id ? "Editar tarefa" : "Nova tarefa",
          `<form data-form="task" data-id="${esc(id || "")}">${formField("O que precisa fazer?", "title", t.title, "text", 'required maxlength="100" autocomplete="off"')}<details ${id ? "open" : ""}><summary>Data e detalhes</summary>${formField("Data", "date", t.date, "date", "required")}${formField("Horário opcional", "time", t.time || "", "time")}${selectField(
            "Repetir",
            "repeat",
            [
              ["none", "Não repetir"],
              ["daily", "Diariamente"],
              ["weekly", "Semanalmente"],
              ["monthly", "Mensalmente"],
              ["yearly", "Anualmente"],
            ],
            t.repeat,
          )}${selectField("Lista", "listId", [["", "Sem lista"], ...org().lists.map((l) => [l.id, l.title])], t.listId || "")}${selectField("Categoria", "category", ["Estudos", "Trabalho", "Saúde", "Pessoal"], t.category)}${selectField(
            "Prioridade",
            "priority",
            [
              ["normal", "Normal"],
              ["high", "Alta"],
              ["low", "Baixa"],
            ],
            t.priority,
          )}${formField("Duração em minutos", "minutes", t.minutes, "number", 'required min="1" max="600"')}<label for="f-notes">Notas</label><textarea id="f-notes" name="notes" maxlength="2000">${esc(t.notes)}</textarea><label for="f-subtasks">Subtarefas, uma por linha</label><textarea id="f-subtasks" name="subtasks" maxlength="3000">${esc(t.subtasks.map((x) => x.title).join("\n"))}</textarea></details><button class="primary wide">Salvar tarefa</button>${id ? `<button type="button" class="quiet wide" data-action="delete-task" data-id="${esc(id)}">Excluir tarefa</button>` : ""}</form>`,
        );
      }

      function entryForm(id) {
        let e = state.finance.entries.find((e) => e.id === id) || {
          title: "",
          type: "expense",
          amount: 0,
          date:
            finMonth === Core.today().slice(0, 7)
              ? Core.today()
              : finMonth + "-01",
          category: "Outros",
          paid: false,
          recurring: false,
        };
        modal(
          id ? "Editar lançamento" : "Novo lançamento",
          `<form data-form="entry" data-id="${esc(id || "")}">${selectField(
            "Tipo",
            "type",
            [
              ["expense", "Despesa"],
              ["income", "Receita"],
            ],
            e.type,
          )}${formField("Descrição", "title", e.title, "text", 'required maxlength="100" list="finance-descriptions" autocomplete="off"')}${financeSuggestions(e.type, id)}${formField("Valor (R$)", "amount", e.amount ? (e.amount / 100).toFixed(2).replace(".", ",") : "", "text", 'inputmode="decimal" required placeholder="0,00"')}${formField("Data de recebimento / vencimento", "date", e.date, "date", "required")}${selectField("Categoria", "category", e.type === "income" ? ["Salário", "Renda extra", "Outros"] : categories, e.category)}<label class="checklabel"><input type="checkbox" name="paid" ${e.paid ? "checked" : ""}> Já foi pago ou recebido</label><label class="checklabel"><input type="checkbox" name="recurring" ${e.recurring ? "checked" : ""}> Repetir mensalmente</label><p class="footnote">Os recorrentes são trazidos pelo botão da aba Lançamentos, sempre como pendentes.</p><button class="primary wide">Salvar lançamento</button>${id ? `<button type="button" class="wide danger" data-action="delete-entry" data-id="${esc(id)}">Excluir lançamento</button>` : ""}</form>`,
        );
      }
      function budgetForm() {
        let b = state.finance.budgets[finMonth] || {};
        modal(
          "Orçamento · " + monthLabel(finMonth),
          `<form data-form="budget"><p class="footnote">Limites para este mês. Deixe vazio para não definir limite.</p>${categories.map((c, i) => formField(c, "budget" + i, b[c] ? (b[c] / 100).toFixed(2).replace(".", ",") : "", "text", 'inputmode="decimal" placeholder="Sem limite"')).join("")}<button class="primary wide">Salvar orçamento</button></form>`,
        );
      }
      function goalForm(id) {
        let g = state.finance.goals.find((g) => g.id === id) || {
          title: "",
          target: 0,
          saved: 0,
        };
        modal(
          id ? "Editar meta" : "Nova meta",
          `<form data-form="goal" data-id="${esc(id || "")}">${formField("Qual é seu plano?", "title", g.title, "text", 'required maxlength="100"')}${formField("Objetivo (R$)", "target", g.target ? (g.target / 100).toFixed(2).replace(".", ",") : "", "text", 'inputmode="decimal" required')}${formField("Total já guardado (R$)", "saved", (g.saved / 100).toFixed(2).replace(".", ","), "text", 'inputmode="decimal" required')}<p class="footnote">Atualize o total acumulado. Não cria lançamento nem altera seu saldo.</p><button class="primary wide">Salvar meta</button>${id ? `<button type="button" class="wide danger" data-action="delete-goal" data-id="${esc(id)}">Excluir meta</button>` : ""}</form>`,
        );
      }
      function download(name, content, type) {
        let url = URL.createObjectURL(new Blob([content], { type })),
          a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      function tick() {
        const t = state.timer,
          n = t.end
            ? Math.max(0, Math.ceil((t.end - Date.now()) / 1000))
            : t.remaining;
        for (const selector of ["#clock", "#mini-clock"]) {
          const el = $(selector);
          if (el)
            el.textContent =
              String(Math.floor(n / 60)).padStart(2, "0") +
              ":" +
              String(n % 60).padStart(2, "0");
        }
        if (t.end && n === 0) {
          const wasFocus = t.mode === "focus";
          if (wasFocus) {
            const at = t.end,
              title =
                t.taskTitle ||
                state.tasks.find((x) => x.id === state.focusTask)?.title ||
                "Foco livre",
              taskId = t.taskId || state.focusTask || null;
            state.sessions.push({
              id: Core.id(),
              at,
              title,
              taskId,
              minutes: t.duration || state.focus,
            });
            state.lastFocus = { at, title, taskId };
          }
          state.timer = {
            mode: wasFocus ? "break" : "focus",
            remaining: state[wasFocus ? "break" : "focus"] * 60,
            end: null,
          };
          save();
          render();
          playModernSound("alert");
          modernNotify(
            "Planner",
            wasFocus
              ? "Sua sessão de foco terminou. Hora de uma pausa."
              : "Sua pausa terminou. Continue no seu ritmo.",
            "focus-end",
          );
          toast(
            wasFocus
              ? "Sessão concluída. Hora de uma pausa!"
              : "Pausa concluída. Pronto para continuar?",
          );
        }
      }

      function mutate(fn, message) {
        fn();
        save();
        render();
        if (message) toast(message);
      }
      document.addEventListener("click", async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const d = b.dataset;
        if (d.page) {
          go(d.page);
          return;
        }
        let a = d.action;
        if (!a) return;
        if (a === "close") $("#modal").close();
        if (a === "task") taskForm(d.id);
        if (a === "entry") entryForm(d.id);
        if (a === "budget") budgetForm();
        if (a === "goal") goalForm(d.id);
        if (a === "complete") completeTask(d.id);
        if (a === "subtask") {
          let t = state.tasks.find((t) => t.id === d.id),
            s = t.subtasks[+d.index];
          s.done = !s.done;
          save();
          b.innerHTML = icon(s.done ? "check" : "box");
        }
        if (a.startsWith("delete-")) {
          let type = a.slice(7),
            collections = {
              task: state.tasks,
              reward: state.rewards,
              entry: state.finance.entries,
              goal: state.finance.goals,
            };
          if (collections[type] && confirm("Excluir este registro?")) {
            let arr = collections[type],
              i = arr.findIndex((x) => x.id === d.id);
            if (i >= 0) arr.splice(i, 1);
            save();
            $("#modal").close();
            render();
            toast("Registro excluído.");
          }
        }
        if (a === "task-filter") {
          taskFilter = d.value;
          render();
        }
        if (a === "day") {
          day = d.value;
          render();
        }
        if (a === "calendar-month") {
          calMonth = moveMonth(calMonth, +d.dir);
          day = calMonth + "-01";
          render();
        }
        if (a === "finance-month") {
          finMonth = moveMonth(finMonth, +d.dir);
          render();
        }
        if (a === "finance-tab") {
          finTab = d.value;
          render();
        }
        if (a === "finance-entries") {
          finTab = "entries";
          render();
        }
        if (a === "history-tab") {
          historyTab = d.value;
          render();
        }

        if (a === "timer") {
          let t = state.timer;
          if (t.end) {
            t.remaining = Math.max(0, Math.ceil((t.end - Date.now()) / 1000));
            t.end = null;
          } else {
            if (!t.startedAt) {
              const task = state.tasks.find((x) => x.id === state.focusTask);
              t.startedAt = Date.now();
              t.taskId = task?.id || null;
              t.taskTitle = task?.title || "Foco livre";
              t.duration = state[t.mode];
            }
            t.end = Date.now() + t.remaining * 1000;
          }
          save();
          render();
        }
        if (a === "timer-reset" || a === "timer-mode") {
          if (
            state.timer.startedAt &&
            !confirm("Encerrar esta sessão sem registrá-la?")
          )
            return;
          const mode =

      function extSubmit(type, v, id) {
        let o = org();
        if (type === "ext-list") {
          if (!v.title.trim()) throw Error("Informe um nome.");
          o.lists.push({ id: Core.id(), title: v.title.trim() });
        }
        if (type === "ext-goal") {
          let target = Number(v.target);
          if (
            !Number.isFinite(target) ||
            target <= 0 ||
            target > 1e9 ||
            !v.unit.trim() ||
            !Ext.periods.includes(v.period)
          )
            throw Error("Confira a meta.");
          o.goals[id] = { target, unit: v.unit.trim(), period: v.period };
        }
        if (type === "ext-log") {
          let amount = Number(v.amount);
          if (
            !Number.isFinite(amount) ||
            amount <= 0 ||
            amount > 1e9 ||
            !Core.validDate(v.date) ||
            v.date > Core.today()

            throw Error("Confira quantidade e data.");
          o.logs.push({ ...v, amount, key: id, id: Core.id() });

        if (type === "ext-note") {
          if (!v.title.trim() || !v.text.trim() || !Core.validDate(v.date))

          else o.notes.push({ ...v, id: Core.id(), favorite: false });

            !v.title.trim() ||
            !Core.validDate(v.date) ||
            v.date > Core.today()

            id: Core.id(),

            since: new Date(v.date + "T00:00").getTime(),
          });

      async function checkLocalReminders() {
        let now = new Date(),
          d = Core.today(),
          time =
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0");
        for (let r of org().reminders) {
          if (!Ext.due(r, d) || r.time > time || r.lastFired === d) continue;
          r.lastFired = d;
          if (
            r.source === "hydration" &&
            now.getHours() * 60 +
              now.getMinutes() -
              (Number(r.time.slice(0, 2)) * 60 + Number(r.time.slice(3))) >
              15
          ) {
            save();
            continue;
          }
          save();
          toast("Lembrete: " + r.title);
          playModernSound("alert");
          await modernNotify("Planner", r.title, r.id);
        }
      }

      setInterval(checkLocalReminders, 30000);

      function routineStopwatch(id) {
        let o = org(),
          w = o.stopwatch;
        if (
          w &&
          w.taskId !== id &&
          (w.elapsed || w.startedAt) &&
          !confirm("Descartar o cronômetro anterior e iniciar nesta rotina?")
        )
          return;
        if (!w || w.taskId !== id)
          w = o.stopwatch = { taskId: id, elapsed: 0, startedAt: null };
        let t = state.tasks.find((t) => t.id === id);
        save();
        modal(
          "Tempo de atividade",
          `<p>${esc(t.title)}</p><p class="big" id="routine-watch">00:00</p><div class="row wrap">${extButton(w.startedAt ? "watch-pause" : "watch-start", w.startedAt ? "Pausar" : "Iniciar", id)}${extButton("watch-log", "Registrar minutos", id)}${extButton("watch-reset", "Zerar", id)}</div><p class="footnote">O tempo continua ao fechar esta tela. Registrar abre a atividade para você conferir antes de salvar.</p>`,
        );
        paintStopwatch();
      }
      function paintStopwatch() {
        let w = org().stopwatch,
          el = $("#routine-watch");
        if (!w || !el) return;
        let seconds = Math.floor(
          (w.elapsed + (w.startedAt ? Date.now() - w.startedAt : 0)) / 1000,
        );
        el.textContent =
          String(Math.floor(seconds / 60)).padStart(2, "0") +
          ":" +
          String(seconds % 60).padStart(2, "0");
      }
      setInterval(paintStopwatch, 500);

      let financeReportFilter = null,
        financeCalendarDay = null;
      function reportFilter() {
        return (
          financeReportFilter || {
            from: finMonth + "-01",
            to: Core.addDays(moveMonth(finMonth, 1) + "-01", -1),
            type: "all",
            status: "all",
            category: "all",
            query: "",
          }
        );
      }
      function reportEntries(filter = reportFilter()) {
        return state.finance.entries
          .filter(
            (e) =>
              e.date >= filter.from &&
              e.date <= filter.to &&
              (filter.type === "all" || e.type === filter.type) &&
              (filter.status === "all" ||
                e.paid === (filter.status === "paid")) &&
              (filter.category === "all" || e.category === filter.category) &&
              normalizeSearch(e.title + " " + e.category).includes(
                normalizeSearch(filter.query),
              ),
          )
          .sort(
            (a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id),
          );
      }
      function reportTotals(entries) {
        return entries.reduce(
          (a, e) => {
            a[e.type] += e.amount;
            if (e.paid) a[e.type + "Paid"] += e.amount;
            return a;
          },
          { income: 0, expense: 0, incomePaid: 0, expensePaid: 0 },
        );
      }
      function previousReportFilter(f) {
        const n =
          Math.round(
            (new Date(f.to + "T12:00Z") - new Date(f.from + "T12:00Z")) /
              86400000,
          ) + 1;
        return {
          ...f,
          from: Core.addDays(f.from, -n),
          to: Core.addDays(f.from, -1),

      }
      function financeReports() {
        const f = reportFilter(),
          es = reportEntries(f),
          t = reportTotals(es),
          prior = previousReportFilter(f),
          p = reportTotals(reportEntries(prior)),
          cats = [
            ...new Set(state.finance.entries.map((e) => e.category)),

        return `<p class="view-description">Cruze filtros e compare períodos com a mesma duração.</p><div class="chips report-presets"><button data-action="report-preset" data-value="today">Hoje</button><button data-action="report-preset" data-value="30days">Últimos 30 dias</button><button data-action="report-preset" data-value="all">Todo o histórico</button></div><form id="finance-report-form"><div class="grid">${formField("De", "from", f.from, "date", "required")}${formField("Até", "to", f.to, "date", "required")}</div><div class="grid">${selectField(
          "Tipo",
          "type",
          [

            ["income", "Receitas"],
            ["expense", "Despesas"],

            ["paid", "Efetivadas"],

      function financeCalendar() {
        const first = finMonth + "-01",
          count = Number(
            Core.addDays(moveMonth(finMonth, 1) + "-01", -1).slice(8),

          { length: count },
          (_, i) => {

      }
      function financeCsv(es) {
        const cell = (v) => {
          let s = String(v);

          "\uFEFF" +
          [
            [
              "Data",
              "Descrição",
              "Tipo",
              "Categoria",
              "Valor (R$)",
              "Situação",

            ...es.map((e) => [

      function financeReportHtml(es, f) {

        return (
          '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planner — relatório financeiro</title><style>body{font:16px system-ui;margin:24px;color:#18202c}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid #ddd}main{overflow-x:auto}@media print{body{margin:0;font-size:11px}tr{break-inside:avoid}}</style><h1>Planner · Finanças</h1><p>' +
          esc(f.from) +

          esc(f.to) +

          " · " +
          esc(f.status) +

          esc(f.category) +

          esc(f.query) +
          "</p><p>Receitas: " +

      function normalizeSearch(text) {

      function financialAttention() {

      function financeEntryResults(entries) {

      }

      function setReportPreset(preset) {

          to = today;
        } else {

            (d, e) => (e.date < d ? e.date : d),

          to = state.finance.entries.reduce(

          );

      }
      document.addEventListener("click", (e) => {
        const d = e.target.closest("button")?.dataset;
        if (!d) return;
        if (d.action === "finance-now") {
          finMonth = Core.today().slice(0, 7);

      let waterTab = "today",
        waterDate = Core.today(),
        waterUndo = null;
      const waterData = () => Hydration.init(state).hydration;
      function hydration() {
        return (
          head(
            "UM CUIDADO NO SEU RITMO",
            "Hidratação",

          ) +
          `<div class="tabs water-tabs">${[

      function waterToday() {

      }
      function waterLogList(date) {

          .logs.filter((l) => Core.date(new Date(l.at)) === date)

        return (
          logs
            .map(
              (l) =>
                `<article class="card water-record"><div class="row"><div class="grow"><b>${Hydration.beverages[l.beverage]} · ${l.amount} mL</b><small>${new Date(l.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</small></div><button class="quiet" data-action="water-edit" data-id="${esc(l.id)}">Editar</button><button class="quiet" data-action="water-delete" data-id="${esc(l.id)}" aria-label="Excluir registro de ${l.amount} mL">Excluir</button></div>${l.note ? `<p class="detail-notes">${esc(l.note)}</p>` : ""}</article>`,

      function waterHistory() {

      }
      function waterSettings() {

        return `<div class="card"><h2>Sua meta, no seu contexto</h2><p>Defina o volume de água que pretende acompanhar. Este aplicativo não calcula necessidades por peso, clima ou idade. Se você tem orientação de restrição de líquidos, siga o volume combinado com seu profissional de saúde.</p><button class="wide" data-action="water-goal">Editar meta diária</button><p class="footnote">Mudanças valem a partir de hoje; metas de dias anteriores são preservadas.</p></div><div class="card"><h2>Lembretes nos seus horários</h2><p>Escolha horários em que costuma estar acordado. Nenhum lembrete é ativado automaticamente.</p>${reminders.map((r) => `<div class="row water-reminder"><span>${r.time} · ${r.enabled ? "Ativo" : "Pausado"}</span><button class="quiet" data-action="water-reminder-toggle" data-id="${esc(r.id)}">${r.enabled ? "Pausar" : "Ativar"}</button><button class="quiet" data-action="water-reminder-remove" data-id="${esc(r.id)}">Excluir</button></div>`).join("")}<form data-form="water-reminder">${formField("Novo horário diário", "time", "", "time", "required")}<button class="wide">Adicionar horário</button></form><div class="row wrap"><button class="quiet" data-action="water-export">Exportar horários</button></div><p class="footnote">Avisos locais dependem da permissão e do aplicativo aberto. Avisos de hidratação com mais de 15 minutos de atraso são ignorados. Para alertas em segundo plano, importe os horários no calendário do celular. Alterações aqui não atualizam os eventos já exportados.</p></div>`;
      }
      function waterGoalForm() {
        const g = Hydration.goal(waterData(), Core.today());
        modal(
          "Minha meta de água",
          `<form data-form="water-goal">${formField("Meta pessoal diária em mL", "amount", g || "", "number", 'min="100" max="10000" step="1" required placeholder="Informe sua meta"')}<p class="footnote">O valor é escolhido por você, não uma recomendação médica. A faixa permitida é apenas um limite técnico de cadastro.</p><button class="primary wide">Salvar meta</button></form>`,

      function waterLogForm(id, date) {

        );
      }
      function waterSubmit(type, v, id) {
        const h = waterData();
        if (type === "water-reminder") {
          if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))
            throw Error("Escolha um horário válido.");
          if (
            org().reminders.some(
              (r) => r.source === "hydration" && r.time === v.time,
            )

      let modernAudio = null;
      function unlockModernAudio() {
        if (!state.preferences.sounds) return;
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          modernAudio = modernAudio || new Audio();
          if (modernAudio.state === "suspended")
            modernAudio.resume().catch(() => {});
        } catch {}
      }
      function playModernSound(kind = "tap") {
        if (!state.preferences.sounds) return;
        unlockModernAudio();
        if (!modernAudio || modernAudio.state !== "running") return;
        try {
          const tones = kind === "alert" ? [523.25, 440] : [440],
            start = modernAudio.currentTime;
          tones.forEach((frequency, i) => {
            const o = modernAudio.createOscillator(),
              g = modernAudio.createGain(),
              at = start + i * 0.11;
            o.type = "sine";
            o.frequency.value = frequency;
            g.gain.setValueAtTime(0, at);
            g.gain.linearRampToValueAtTime(0.035, at + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
            o.connect(g);
            g.connect(modernAudio.destination);
            o.start(at);
            o.stop(at + 0.17);
            o.onended = () => {
              o.disconnect();
              g.disconnect();
            };
          });
        } catch {}
      }

                ? "focus"

          w.routines = id
            ? w.routines.map((x) => (x.id === id ? r : x))
            : [...w.routines, r];
        } else throw Error("Formulário de treino desconhecido.");
        workoutCommit(w);
        $("#modal").close();
        render();
        toast("Treino salvo.");
      }
      // Flush visible inputs before any action or navigation; a click must not lose an edit.
      function syncWorkoutInputs() {
        const s = Workouts.active(workoutData());
        if (!s || !document.querySelector("[data-workout-field]")) return true;
        const next = structuredClone(workoutData()),
          draft = Workouts.active(next);
        for (const input of document.querySelectorAll("[data-workout-field]")) {
          if (!input.reportValidity()) return false;
          draft.exercises[Number(input.dataset.exercise)].sets[
            Number(input.dataset.set)
          ][input.dataset.workoutField] = Number(input.value);
        }
        workoutCommit(next);
        return true;
      }
      document.addEventListener(
        "click",
        (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          const d = b.dataset,
            a = d.action;
          if (!a?.startsWith("workout-") && !d.page) return;
          try {
            if (
              Workouts.active(workoutData()) &&
              page === "workouts" &&
              a !== "workout-discard" &&
              !syncWorkoutInputs()
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return;
            }
            if (!a?.startsWith("workout-")) return;
            e.stopImmediatePropagation();
            e.preventDefault();
            if (a === "workout-tab") {
              workoutTab = d.id;
              render();
            }
            if (a === "workout-exercise") workoutExerciseForm(d.id);
            if (a === "workout-routine") workoutRoutineForm(d.id);
            if (a === "workout-add-row") {
              const box = $("#workout-routine-rows");
              if (box.children.length >= 50)
                throw Error("Limite de 50 exercícios por rotina.");
              box.insertAdjacentHTML(
                "beforeend",
                workoutRoutineRow(
                  {
                    exercise: workoutData().exercises[0].id,
                    sets: 3,
                    reps: 10,
                    kg: 0,
                    rest: 60,
                  },
                  box.children.length,
                ),
              );
              labelRoutineRows();
            }
            if (a === "workout-remove-row") {
              const row = b.closest("fieldset");
              if (row.parentElement.children.length <= 1)
                throw Error("Mantenha pelo menos um exercício.");
              row.remove();
              labelRoutineRows();
            }
            if (a === "workout-row-up") {
              const row = b.closest("fieldset");
              if (row.previousElementSibling)
                row.parentElement.insertBefore(row, row.previousElementSibling);
              labelRoutineRows();
            }
            if (a === "workout-start") {
              const copy = structuredClone(state);
              Workouts.start(copy, d.id);
              workoutCommit(copy.workouts);
              render();
              window.scrollTo({ top: 0, behavior: "instant" });
            }
            if (a === "workout-set") {
              const next = structuredClone(workoutData()),
                s = Workouts.active(next),
                exercise = s.exercises[Number(d.exercise)],
                set = exercise.sets[Number(d.set)];
              set.done = !set.done;
              s.restUntil =
                set.done && exercise.rest
                  ? Date.now() + exercise.rest * 1000
                  : null;
              workoutCommit(next);
              render();
              if (set.done) playModernSound("tap");
            }
            if (a === "workout-skip-rest") {
              const next = structuredClone(workoutData());
              Workouts.active(next).restUntil = null;
              workoutCommit(next);
              paintWorkoutClock();
            }
            if (a === "workout-finish") {
              const s = Workouts.active(workoutData());
              if (!s) throw Error("Nenhum treino ativo.");
              if (!s.exercises.some((e) => e.sets.some((t) => t.done)))
                throw Error("Conclua ao menos uma série.");
              if (
                s.exercises.some((e) => e.sets.some((t) => !t.done)) &&
                !confirm(
                  "Finalizar com séries não realizadas? Apenas as séries concluídas entram no volume e nos recordes.",
                )
              )
                return;
              const copy = structuredClone(state);
              Workouts.finish(copy);
              Workouts.validate(copy);
              const before = state;
              state = copy;
              if (!save()) {
                state = before;
                throw Error(
                  "Não foi possível salvar o treino. Tente novamente ou exporte um backup.",
                );
              }
              workoutTab = "history";
              render();
              window.scrollTo({ top: 0, behavior: "instant" });
              toast("Treino concluído.");
              playModernSound("success");
            }
            if (a === "workout-discard" && confirm("Descartar esta sessão?")) {
              const next = structuredClone(workoutData());
              next.sessions = next.sessions.filter(
                (s) => s.finishedAt !== null,
              );
              workoutCommit(next);
              render();
            }
            if (a === "workout-history-reset") {
              workoutDate = "";
              workoutExercise = "all";
              render();
            }
          } catch (err) {
            e.stopImmediatePropagation();
            showIssue(err.message);
          }
        },
        true,
      );
      document.addEventListener("input", (e) => {
        if (e.target.id === "workout-search") {
          workoutQuery = e.target.value;
          $("#workout-library-results").innerHTML = workoutLibraryResults();
        }
        if (
          e.target.matches("[data-workout-field]") &&
          e.target.validity.valid
        ) {
          try {
            syncWorkoutInputs();
          } catch (err) {
            showIssue(err.message);
          }
        }
      });
      document.addEventListener("change", (e) => {
        try {
          if (e.target.id === "workout-type") {
            workoutType = e.target.value;
            render();
          }
          if (e.target.id === "workout-group") {
            workoutGroup = e.target.value;
            render();
          }
          if (e.target.id === "workout-history-date") {
            workoutDate = e.target.value;
            render();
          }
          if (e.target.id === "workout-history-exercise") {
            workoutExercise = e.target.value;
            render();
          }
          if (e.target.matches("[data-workout-field]")) syncWorkoutInputs();
        } catch (err) {
          showIssue(err.message);
        }
      });
      setInterval(paintWorkoutClock, 500);

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        installPrompt = e;
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) tick();
      });
      setInterval(tick, 500);
      render();
      if (location.search) {
        const notice = new URLSearchParams(location.search).get("notice");
        if (["focus", "tasks"].includes(notice)) go(notice);
      }
      if (loadError)
        toast(
          "Não foi possível ler os dados salvos. O original foi preservado.",
        );
      else save();
    </script>
  </body>
</html>
