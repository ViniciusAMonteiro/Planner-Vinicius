    <div class="shell">
      <header id="header"></header>
      <main id="app" tabindex="-1"></main>

    <script>
"use strict";

// REGRAS
function migrateCompasso(s) {
  const lists = s.organizer.lists;
  const lookup = new Map(lists.map(l => [l.title.trim().toLocaleLowerCase('pt-BR'), l.id]));
  for (const t of s.tasks) {
    const ids = new Set([...(Array.isArray(t.listIds) ? t.listIds : []), t.listId].filter(Boolean));
    if (typeof t.category === 'string' && t.category.trim()) {
      const title = t.category.trim().slice(0, 100);
      const key = title.toLocaleLowerCase('pt-BR');
      if (!lookup.has(key)) {
        const id = Core.id(); lists.push({id, title}); lookup.set(key, id);
      }
      ids.add(lookup.get(key));
    }
    t.listIds = [...ids].filter(id => lists.some(l => l.id === id));
    t.listId = t.listIds[0] || '';
    delete t.category;
  }
  // Remove apenas campos temáticos conhecidos; tarefas e históricos permanecem.
  const legacy = new Set(['cats','rewards','coins','scene','color','cat','soundVolume','xp','xpTotal','totalXp','level','levels','rewarded','pinnedTask','taskView']);
  const clean = value => {
    if (!value || typeof value !== 'object') return;
    for (const key of Object.keys(value)) {
      if (legacy.has(key)) delete value[key]; else clean(value[key]);
    }
  };
  clean(s);
  delete s.theme;
  delete s.preferences.motion;
  s.migrations.compassoV1 = true;
  return s;
}

function generateMonthlyEntries(s, through = Core.today().slice(0, 7)) {
  const entries = s.finance.entries;
  const skips = s.finance.recurringSkips || [];
  if (!Array.isArray(skips) || skips.some(v => typeof v !== 'string' || v.length > 120)) throw Error('Recorrências inválidas.');
  const groups = new Map();
  for (const entry of entries) {
    if (!entry.recurring && !entry.recurringId) continue;
    const root = entry.recurringId || entry.id;
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(entry);
  }
  let count = 0;
  for (const [root, group] of groups) {
    group.sort((a,b) => a.date.localeCompare(b.date));
    const latest = group[group.length - 1];
    if (!latest.recurring) continue;
    const occupied = new Set(group.map(e => e.date.slice(0, 7)));
    const anchor = latest.repeatDay || Number(latest.date.slice(8));
    let month = group[0].date.slice(0, 7);
    while (month <= through) {
      const template = [...group].reverse().find(e => e.date.slice(0,7) <= month);
      if (template?.recurring && !occupied.has(month) && !skips.includes(root + ':' + month)) {
        if (entries.length >= 200000) throw Error('Limite de lançamentos atingido.');
        const [year, m] = month.split('-').map(Number);
        const day = Math.min(anchor, new Date(year, m, 0).getDate());
        entries.push({...template, id:Core.id(), recurringId:root, repeatDay:anchor,
          date:month + '-' + String(day).padStart(2,'0'), paid:false});
        occupied.add(month); count++;
      }
      month = moveMonth(month, 1);
    }
  }
  return count;
}

function taskListsField(t) {
  const selected = new Set(t.listIds || [t.listId]);
  return '<fieldset><legend>Listas</legend>' + org().lists.map(l =>
    `<label class="checklabel"><input type="checkbox" name="listIds" value="${esc(l.id)}" ${selected.has(l.id)?'checked':''}>${esc(l.title)}</label>`
  ).join('') + (org().lists.length ? '' : '<p class="muted">Crie listas em Tarefas.</p>') + '</fieldset>';
}

function recordRoutine(s, taskId, data) {
  const task = s.tasks.find(t => t.id === taskId);
  if (!task || task.repeat === 'none') throw Error('Recorrente não encontrada.');
  const key = task.seriesId || task.id;
  if (!s.organizer.goals[key]) throw Error('Defina uma meta primeiro.');
  const amount = Number(data.amount);
  if (!Number.isFinite(amount) || amount <= 0 || amount > 1e9 || !Core.validDate(data.date) || data.date > Core.today()) throw Error('Confira quantidade e data.');
  if (task.date > Core.today()) throw Error('Esta ocorrência está planejada para uma data futura.');
  s.organizer.logs.push({id:Core.id(), key, taskId:task.id, amount, date:data.date, note:data.note || ''});
  if (!task.done) Core.toggleTask(s, task.id);
}

function refreshMonthlyEntries() {
  if (loadError) return;
  const copy = structuredClone(state);
  try {
    if (generateMonthlyEntries(copy)) commit(draft => {draft.finance = copy.finance;});
  } catch (error) {showIssue(error.message);}
}

const Core = (() => {
        
        const date = (d) =>
          `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        const today = () => date(new Date());
        const id = () =>
          globalThis.crypto?.randomUUID?.() ||
          Date.now().toString(36) + Math.random().toString(36).slice(2);
        const validDate = (s) =>
          typeof s === "string" &&
          /^\d{4}-\d{2}-\d{2}$/.test(s) &&
          date(new Date(s + "T12:00:00")) === s;
        function addDays(s, n) {
          let d = new Date(s + "T12:00");
          d.setDate(d.getDate() + n);
          return date(d);
        }
        function nextDate(s, repeat, anchor) {
          if (repeat === "daily") return addDays(s, 1);
          if (repeat === "weekly") return addDays(s, 7);
          if (repeat === "yearly") {
            let d = new Date(s + "T12:00"),
              m = d.getMonth(),
              day = d.getDate();
            d.setDate(1);
            d.setFullYear(d.getFullYear() + 1);
            d.setDate(

function backupBeforeCleanup(raw, key = "nekoquest_before_cleanup_v2") {
 if (raw !== null && localStorage.getItem(key) === null) localStorage.setItem(key, raw);
}

function initializeState(raw = Core.defaults()) {
  let candidate = structuredClone(raw);
  for (const module of STATE_MODULES) candidate = module.init(candidate);
  return migrateCompasso(candidate);
}

function validateState(candidate) {
  for (const module of STATE_MODULES) module.validate(candidate);
  return candidate;
}

function migrateState(raw, source = JSON.stringify(raw)) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw) || ![undefined,3,4,STATE_VERSION].includes(raw.version)) throw Error('Versão de backup não suportada.');
  if (raw.version !== STATE_VERSION) backupBeforeCleanup(source, MIGRATION_BACKUP_KEY);
  if (!raw.migrations?.compassoV1 || /"(?:cats|rewards|coins|scene|color|cat|soundVolume|xp|xpTotal|totalXp|theme|motion|level|levels|rewarded|pinnedTask|taskView)"\s*:/.test(source)) backupBeforeCleanup(source, 'nekoquest_before_compasso_v1');
  const candidate = validateState(initializeState(raw));
  generateMonthlyEntries(candidate);
  return validateState(candidate);
}

function loadState() {
  const current=localStorage.getItem(STATE_KEY);
  if (current!==null) {
    backupBeforeCleanup(current,'nekoquest_before_minimal_v1');
    backupBeforeCleanup(current);
    return migrateState(JSON.parse(current),current);
  }
  const previous=localStorage.getItem('nekoquest_v3');
  if (previous!==null) {
    backupBeforeCleanup(previous);
    return migrateState(JSON.parse(previous),previous);
  }
  const legacy=localStorage.getItem('neko_tasks_v1');
  if (legacy!==null) {
    backupBeforeCleanup(legacy);
    return migrateState({tasks:JSON.parse(legacy)},legacy);
  }
  return validateState(initializeState());
}

function commit(mutation = null, {redraw=true,message=''} = {}) {
  if (loadError) {
    toast('Importe um backup para retomar o salvamento. O arquivo anterior foi preservado.');
    return false;
  }
  const previous=structuredClone(lastCommittedState);
  try {
    if (mutation) {
      state=structuredClone(state);
      const result=mutation(state);
      if (result&&typeof result.then==='function') throw Error('A mutação de commit deve ser síncrona.');
    }
    migrateCompasso(state);
    validateState(state);
    generateMonthlyEntries(state);
    validateState(state);
    const raw=JSON.stringify(state);
    localStorage.setItem(STATE_KEY,raw);
    lastCommittedState=JSON.parse(raw);
    const hadUndo=undoEntry;
    undoEntry=pendingUndo;
    pendingUndo=null;
    if (redraw) render();
    if (message) toast(message);
    else if (undoEntry) toast('Alteração salva.');
    else if (hadUndo) {$('#toast').hidden=true;clearTimeout(window.toastTimer);}
    return true;
  } catch(error) {
    state=previous;
    pendingUndo=null;
    showIssue(error.message);
    return false;
  }
}

function prepareUndo() {
  const candidate = {state:structuredClone(state)};
  pendingUndo = candidate;
  setTimeout(() => { if (pendingUndo === candidate) pendingUndo = null; }, 0);
}

function undoLastChange() {
  const entry = undoEntry;
  if (!entry) { toast('Não há alteração para desfazer.'); return; }
  const current = state;
  state = validateState(structuredClone(entry.state));
  if (!commit(null, {redraw:false})) { state = current; return; }
  $('#modal').close();
  render();
  toast('Alteração desfeita.');
}

function timerMinutes(mode = state.timer.mode, taskId = state.focusTask) {
        if (mode === "break") return state.break;
        const task = state.tasks.find((item) => item.id === taskId);
        const minutes = Number(task?.minutes);
        return Number.isFinite(minutes) && minutes >= 1 && minutes <= 600
          ? minutes
          : state.focus;

function tick() {
        const t = state.timer,
          n = t.end
            ? Math.max(0, Math.ceil((t.end - Date.now()) / 1000))
            : t.startedAt
              ? t.remaining
              : timerMinutes(t.mode) * 60;
        for (const selector of ["#clock", "#mini-clock"]) {
          const el = $(selector);
          if (el)
            el.textContent =
              String(Math.floor(n / 60)).padStart(2, "0") +
              ":" +
              String(n % 60).padStart(2, "0");
        }
        if (t.end && n === 0) {
          const wasFocus = t.mode === "focus";
          if (wasFocus) {
            const at = t.end,
              title =
                t.taskTitle ||
                state.tasks.find((x) => x.id === state.focusTask)?.title ||
                "Foco livre",
              taskId = t.taskId || state.focusTask || null;
            state.sessions.push({
              id: Core.id(),
              at,
              title,
              taskId,
              minutes: t.duration || state.focus,
            });
            state.lastFocus = { at, title, taskId };
          }
          state.timer = {
            mode: wasFocus ? "break" : "focus",
            remaining: timerMinutes(wasFocus ? "break" : "focus") * 60,
            end: null,
          };
          if (!commit(null, {redraw:false})) return;
          render();
          playModernSound("alert");
          modernNotify(
            "Compasso",
            wasFocus
              ? "Sua sessão de foco terminou. Hora de uma pausa."

          )

          let r = o.reminders.find((x) => x.id === id);
          if (r) Object.assign(r, v, { lastFired: null });
          else o.reminders.push({ ...v, id: Core.id(), enabled: true });
        }
        if (type === "ext-quit") {
          if (
            !v.title.trim() ||
            !Core.validDate(v.date) ||
            v.date > Core.today()
          )
            throw Error("Confira nome e data.");

async function checkLocalReminders() {
        let now = new Date(),
          d = Core.today(),
          time =
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0");
        for (let r of org().reminders) {
          if (!Ext.due(r, d) || r.time > time || r.lastFired === d) continue;
          r.lastFired = d;
          if (
            r.source === "hydration" &&
            now.getHours() * 60 +
              now.getMinutes() -
              (Number(r.time.slice(0, 2)) * 60 + Number(r.time.slice(3))) >
              15
          ) {
            if (!commit(null, {redraw:false})) return;
            continue;
          }
          if (!commit(null, {redraw:false})) return;
          toast("Lembrete: " + r.title);
          playModernSound("alert");
          await modernNotify("Compasso", r.title, r.id);
        }
      }

function reportEntries(filter = reportFilter()) {

          .filter(

              e.date <= filter.to &&
              (filter.type === "all" || e.type === filter.type) &&
              (filter.status === "all" ||
                e.paid === (filter.status === "paid")) &&

function unlockModernAudio() {
        if (!state.preferences.sounds) return;
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          modernAudio = modernAudio || new Audio();
          if (modernAudio.state === "suspended")
            modernAudio.resume().catch(() => {});
        } catch {}
      }

function playModernSound(kind = "tap") {
        if (!state.preferences.sounds) return;
        unlockModernAudio();
        if (!modernAudio || modernAudio.state !== "running") return;
        try {
          const tones = kind === "alert" ? [523.25, 440] : [440],
            start = modernAudio.currentTime;
          tones.forEach((frequency, i) => {
            const o = modernAudio.createOscillator(),
              g = modernAudio.createGain(),
              at = start + i * 0.11;
            o.type = "sine";
            o.frequency.value = frequency;
            g.gain.setValueAtTime(0, at);
            g.gain.linearRampToValueAtTime(0.035, at + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
            o.connect(g);
            g.connect(modernAudio.destination);
            o.start(at);
            o.stop(at + 0.17);
            o.onended = () => {
              o.disconnect();
              g.disconnect();
            };
          });
        } catch {}
      }

async function modernNotify(title, body, tag = "nekoquest-alert") {
        if (
          !state.preferences.alerts ||
          !("Notification" in window) ||
          Notification.permission !== "granted"
        )
          return false;
        try {
          const registration = await navigator.serviceWorker?.getRegistration();
          const options = {
            body,
            tag,
            data: {
              page: tag.startsWith("focus")
                ? "focus"
                : tag.startsWith("workout")
                  ? "workouts"
                  : "tasks",
            },
          };
          if (registration) await registration.showNotification(title, options);
          else new Notification(title, options);
          return true;
        } catch {
          return false;
        }
      }

function captureView() {
  const active = document.activeElement;
  const roots = ['#header', '#app', '#nav'];
  const root = roots.find(selector => $(selector).contains(active));
  const describe = element => element ? {
    tag: element.tagName,
    attributes: ['id','name','data-page','data-action','data-id','data-index','data-value','data-dir','data-exercise','data-set','data-workout-field']
      .filter(name => element.hasAttribute(name))
      .map(name => [name, element.getAttribute(name)])
  } : null;
  return {
    x: window.scrollX, y: window.scrollY, root,
    focus: root ? describe(active) : null,
    index: root ? [...$(root).querySelectorAll(focusableSelector)].filter(el=>el.getClientRects().length&&!el.disabled).indexOf(active) : -1,
    selection: active instanceof HTMLInputElement || active instanceof HTMLTextAreaElement
      ? [active.selectionStart, active.selectionEnd, active.selectionDirection] : null,
    draft: active?.id === 'quick-title' ? active.value : null,
    details: [...$('#app').querySelectorAll('details[id]')].map(el => [el.id, el.open])
  };
}

function restoreView(view, navigation = false) {
  for (const [id, open] of view?.details || []) {
    const element = document.getElementById(id);
    if (element instanceof HTMLDetailsElement) element.open = open;
  }
  if (!$('#modal').open && !$('#decision')?.open) {
    const root = view?.root ? $(view.root) : null;
    const candidates = root ? [...root.querySelectorAll(focusableSelector)].filter(el=>el.getClientRects().length&&!el.disabled) : [];
    const target = view?.focus?.attributes.length ? candidates.find(el => el.tagName === view.focus.tag &&
      view.focus.attributes.every(([key, value]) => el.getAttribute(key) === value)) : null;
    const fallback = view?.index >= 0 ? candidates[Math.min(view.index, candidates.length - 1)] : null;
    const focus = navigation ? $('#app') : target || fallback;
    if (focus) {
      if (view?.draft !== null && focus.id === 'quick-title') focus.value = view.draft;
      focus.focus({preventScroll:true});
      if (!navigation && focus === target && view.selection && view.selection[0] !== null) {
        try { focus.setSelectionRange(...view.selection); } catch {}
      }
    }
  }
  window.scrollTo({left:view?.x || 0, top:view?.y || 0, behavior:'instant'});
}

function decisionDialog(message, value = null) {
  if ($('#decision')?.open) return Promise.resolve(value === null ? false : null);
  const dialog = document.createElement('dialog');
  dialog.id = 'decision';
  dialog.setAttribute('aria-labelledby','decision-title');
  dialog.innerHTML = `<form method="dialog"><h2 id="decision-title">${esc(message)}</h2>${value === null ? '' : formField('Nome','decision-name',value,'text','required maxlength="100"')}<div class="row"><button type="submit" value="cancel" formnovalidate>Cancelar</button><button type="submit" value="accept" class="primary">${value === null ? 'Confirmar' : 'Salvar'}</button></div></form>`;
  document.body.append(dialog);
  return new Promise(resolve => {
    dialog.addEventListener('close', () => {
      const accepted = dialog.returnValue === 'accept';
      const result = value === null ? accepted : accepted ? dialog.querySelector('input').value : null;
      dialog.remove();
      resolve(result);
    }, {once:true});
    dialog.showModal();
    const input = dialog.querySelector('input');
    if (input) { input.focus(); input.select(); }
    else dialog.querySelector('button[value=cancel]').focus();
  });
}

}

async function routineStopwatch(id) {
        let o = org(),
          w = o.stopwatch;
        if (
          w &&
          w.taskId !== id &&
          (w.elapsed || w.startedAt) &&
          !await confirmAction("Descartar o cronômetro anterior e iniciar nesta rotina?")
        )
          return;
        if (!w || w.taskId !== id)
          w = o.stopwatch = { taskId: id, elapsed: 0, startedAt: null };
        let t = state.tasks.find((t) => t.id === id);
        if (!commit(null, {redraw:false})) return;
        modal(
          "Tempo de atividade",
          `<p>${esc(t.title)}</p><p class="big" id="routine-watch">00:00</p><div class="row wrap">${extButton(w.startedAt ? "watch-pause" : "watch-start", w.startedAt ? "Pausar" : "Iniciar", id)}${extButton("watch-log", "Registrar minutos", id)}${extButton("watch-reset", "Zerar", id)}</div><p class="footnote">O tempo continua ao fechar esta tela. Registrar abre a atividade para você conferir antes de salvar.</p>`,
        );
        paintStopwatch();
      }

function financeCalendar() {
        const first = finMonth + "-01",
          count = Number(

function financialAttention() {

function hydration() {

function waterToday() {
        const h = waterData(),
          d = Hydration.day(h, Core.today()),
          percent = d.goal
            ? Math.min(100, Math.round((d.water / d.goal) * 100))
            : 0;
        return `<section class="card water-hero"><h2>${d.water.toLocaleString("pt-BR")} <small>mL de água</small></h2><p>${d.goal ? `Meta pessoal: ${d.goal.toLocaleString("pt-BR")} mL · ${percent}%` : "Defina uma meta pessoal para acompanhar o progresso."}</p>${d.goal ? `<progress aria-label="Progresso da meta pessoal de água" value="${Math.min(d.water, d.goal)}" max="${d.goal}"></progress><p class="muted">${d.water >= d.goal ? "Meta registrada." : `Faltam ${d.goal - d.water} mL para a meta que você escolheu.`}</p>` : '<button data-action="water-goal">Definir minha meta</button>'}</section><div class="section"><h2>Já bebeu água? Registre.</h2></div><div class="water-quick">${[150, 250, 500].map((n) => `<button data-action="water-quick" data-amount="${n}" aria-label="Registrar ${n} mililitros de água"><b>+ ${n}</b><small>mL</small></button>`).join("")}</div><button class="wide" data-action="water-log">Outro volume ou bebida</button>${waterUndo && h.logs.some((l) => l.id === waterUndo) ? '<button class="quiet wide" data-action="water-undo">Desfazer último registro rápido</button>' : ""}<div class="grid section"><div class="card"><small>Outras bebidas hoje</small><h3>${(d.total - d.water).toLocaleString("pt-BR")} mL</h3></div><div class="card"><small>Sequência de registros</small><h3>${Hydration.streak(h)} dia(s)</h3></div></div><p class="footnote">A meta acompanha apenas água. Outras bebidas são registradas em volume, sem calcular equivalências de hidratação. A sequência mede dias com registros, não quantidade consumida.</p><h2>Registros de hoje</h2>${waterLogList(Core.today())}`;
      }

function waterLogList(date) {
        const logs = waterData()
          .logs.filter((l) => Core.date(new Date(l.at)) === date)
          .sort((a, b) => b.at - a.at);

          logs
            .map(
              (l) =>
                `<article class="card water-record"><div class="row"><div class="grow"><b>${Hydration.beverages[l.beverage]} · ${l.amount} mL</b><small>${new Date(l.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</small></div><button class="quiet" data-action="water-edit" data-id="${esc(l.id)}">Editar</button><button class="quiet" data-action="water-delete" data-id="${esc(l.id)}" aria-label="Excluir registro de ${l.amount} mL">Excluir</button></div>${l.note ? `<p class="detail-notes">${esc(l.note)}</p>` : ""}</article>`,
            )
            .join("") ||
          '<div class="card"><p class="muted">Nenhuma bebida registrada nesta data.</p></div>'
        );
      }

function waterHistory() {
        const h = waterData(),
          days = Array.from({ length: 7 }, (_, i) => {
            const date = Core.addDays(waterDate, i - 6);
            return { date, ...Hydration.day(h, date) };

          max = Math.max(1, ...days.map((d) => d.water));

const AREA_DATA = [
        ["tasks", "Tarefas", "task"],
        ["calendar", "Agenda", "calendar"],
        ["habits", "Recorrentes", "routine"],
        ["workouts", "Treinos", "workout"],
        ["food", "Alimentação", "food"],
        ["hydration", "Hidratação", "water"],
        ["finance", "Finanças", "wallet"],
        ["insights", "Progresso", "insights"],
        ["focus", "Pomodoro", "clock"],
        ["journal", "Diário", "journal"],
        ["history", "Histórico", "history"],
        ["personalizacao", "Personalização", "settings"],
      ];

const AREA_PAGES = new Set(AREA_DATA.map((a) => a[0]));

function areaSummary(p) {
  const today = Core.today();
  switch(p) {
    case 'tasks': {
      const count = state.tasks.filter(t=>!t.done&&!t.archived&&t.date<=today).length;
      return count ? `${count} pendente${count===1?'':'s'}` : 'Tudo em dia';
    }
    case 'calendar': return state.tasks.filter(t=>!t.archived&&t.date===today).length+' tarefa(s) hoje';
    case 'habits': return series().length+' recorrência(s)';
    case 'workouts': return Workouts.active(state.workouts) ? 'Treino em andamento' : Workouts.completed(state.workouts).filter(s=>Core.date(new Date(s.finishedAt))===today).length+' treino(s) hoje';
    case 'food': return (state.food?.plans||[]).filter(p=>p.date===today&&p.done).length+' refeições preparadas';
    case 'finance': return money(Core.finance(state,today.slice(0,7)).balance);
    case 'hydration': { const d=Hydration.day(waterData(),today); return d.water+' mL'+(d.goal?' / '+d.goal+' mL':''); }
    case 'insights': return Core.week(state).reduce((n,d)=>n+d.count,0)+' concluída(s) na semana';
    case 'focus': return state.timer.startedAt ? state.timer.end?'Sessão em andamento':'Sessão pausada' : timerMinutes('focus')+' min de foco';
    case 'journal': return org().notes.length+' nota(s)';
    case 'history': return (state.history.filter(h=>['task','reopen'].includes(h.type)).length+state.sessions.length)+' registro(s)';
    case 'personalizacao': return state.minimal?.density==='compact'?'Espaçamento compacto':'Espaçamento confortável';
    default: return '';
  }
}

function areaTile(p,label,i) {
  return `<button class="area-tile" data-page="${p}">${icon(i)}<span class="area-copy"><span>${esc(label)}</span><small>${esc(areaSummary(p))}</small></span></button>`;
}

function areas() {
        return (
          head("Áreas") +
          `<div class="area-grid">${AREA_DATA.map(([p, label, i]) => areaTile(p, label, i)).join("")}</div>`
        );
      }

function home() {
  const today = Core.today();
  const items = state.tasks.filter(t=>!t.archived && t.date===today);
  return `<h1>${state.name ? 'Olá, '+esc(state.name)+'.' : 'Hoje'}</h1>
    <form data-form="quick-task" class="quick-add">
      <label class="sr-only" for="quick-title">Nova tarefa para hoje</label>
      <input id="quick-title" name="title" required maxlength="100" placeholder="Adicionar tarefa para hoje" autocomplete="off">
      <button type="submit" class="primary" aria-label="Adicionar tarefa">${icon('plus')}</button>
    </form>
    <section class="section"><h2>Tarefas de hoje</h2>${taskList(items)}</section>
    <section class="home-list"><h2>Visão do dia</h2>${[
      ['hydration','Hidratação'],['food','Alimentação'],['workouts','Treinos']
    ].map(([route,label])=>`<button class="summary-row" data-page="${route}"><span>${label}</span><span class="muted">${esc(areaSummary(route))}</span></button>`).join('')}</section>`;
}

function render({navigation = false} = {}) {
  const samePage = renderedPage === page;
  const previous = samePage ? captureView() : viewPositions.get(page);
  if (samePage) viewPositions.set(page,previous);
  const title = AREA_DATA.find(([route])=>route===page)?.[1] || ({areas:'Áreas',profile:'Perfil'}[page]) || 'Compasso';
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  document.querySelector('meta[name=theme-color]').content = dark?'#191b19':'#faf9f6';
  document.body.dataset.density=state.minimal?.density||'comfortable';
  $('#header').innerHTML = page==='home'
    ? `<span class="brand">Compasso</span><time datetime="${Core.today()}" class="muted">${new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long'})}</time>`
    : `<button class="quiet icon-btn" data-action="navigate-back" aria-label="Voltar">${icon('back')}</button><h1 id="page-title">${esc(title)}</h1>`;
  $('#nav').innerHTML=PRIMARY_NAV.map(([route,i,label])=>`<button data-page="${route}" class="${page===route||route==='areas'&&AREA_PAGES.has(page)?'active':''}" ${page===route||route==='areas'&&AREA_PAGES.has(page)?'aria-current="page"':''}>${icon(i)}<span>${label}</span></button>`).join('');
  const view={home,areas,tasks,calendar:()=>head('Agenda')+calendar(),habits:()=>head('Recorrentes')+routines(),focus,workouts:workoutPage,finance:finances,history,personalizacao,profile,insights,journal,hydration,food}[page]||home;
  const content=document.createElement('div');
  content.innerHTML=view();
  const heading=content.querySelector('h1');
  if(page==='home') heading?.setAttribute('id','page-title');
  else if(page==='workouts'&&Workouts.active(state.workouts)&&heading) {
    const name=document.createElement('h2');name.textContent=heading.textContent;heading.replaceWith(name);
  } else heading?.remove();
  const app=$('#app');app.dataset.page=page;app.setAttribute('aria-labelledby','page-title');
  app.replaceChildren(...content.childNodes);
  if(['tasks','calendar','habits'].includes(page)) app.insertAdjacentHTML('beforeend',`<button class="fab primary" data-action="task" aria-label="Adicionar tarefa">${icon('plus')}</button>`);
  renderedPage=page;
  tick();paintWorkoutClock();
  restoreView(previous,navigation);
}

  return head('Personalização')+`<h2>Espaçamento</h2><p class="muted">Escolha quanto espaço deseja entre os registros.</p><div class="tabs">${[
    ['comfortable','Confortável'],['compact','Compacto']
  ].map(([value,label])=>`<button data-action="density" data-value="${value}" aria-pressed="${density===value}" class="${density===value?'selected':''}">${label}</button>`).join('')}</div><p class="footnote">O tema acompanha a aparência clara ou escura do dispositivo.</p>${modernSettings()}<p class="footnote">Avisos locais exigem o aplicativo aberto. Para alertas com ele fechado, exporte seus lembretes para o calendário.</p>`;
}

function workoutActive(s) {
        const count = s.exercises.reduce(
            (n, e) => n + e.sets.filter((t) => t.done).length,
            0,
          ),
          total = s.exercises.reduce((n, e) => n + e.sets.length, 0);
        return (
          head(s.name) +
          `<section class="card"><div class="row"><div class="grow"><b>${count} / ${total} séries</b><p class="muted">Iniciado às ${new Date(s.startedAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</p></div></div><progress value="${count}" max="${total}" aria-label="Séries concluídas"></progress></section><section class="rest-bar" aria-label="Descanso"><div><small>Descanso entre séries</small><strong id="workout-clock" role="timer">00:00</strong></div>${workoutButton("workout-skip-rest", "Encerrar descanso", "", "quiet")}</section>` +
          s.exercises
            .map((e, ei) => {
              const previous =
                Workouts.previous(workoutData(), e.exercise)?.sets.filter(
                  (t) => t.done,
                ) || [];
              return `<article class="card"><h2>${esc(e.name)}</h2><p class="muted">${esc(e.group)} · ${workoutTypes[e.type]} · ${e.rest}s de descanso</p><div class="set-labels" aria-hidden="true"><span>Série</span><span>kg</span><span>Reps</span><span>Feita</span></div>${e.sets.map((t, si) => `<div class="set-row ${t.done ? "set-done" : ""}"><span>${si + 1}</span><input type="number" aria-label="Carga em kg, ${esc(e.name)}, série ${si + 1}" data-workout-field="kg" data-exercise="${ei}" data-set="${si}" min="0" max="2000" step="0.25" value="${t.kg}" required><input type="number" aria-label="Repetições, ${esc(e.name)}, série ${si + 1}" data-workout-field="reps" data-exercise="${ei}" data-set="${si}" min="1" max="10000" step="1" value="${t.reps}" required><button data-action="workout-set" data-exercise="${ei}" data-set="${si}" class="icon-btn ${t.done ? "primary" : ""}" aria-pressed="${t.done}" aria-label="${t.done ? "Reabrir" : "Concluir"} série ${si + 1} de ${esc(e.name)}">${icon(t.done ? "check" : "box")}</button></div><small class="previous-set">Anterior: ${previous[si] ? workoutNumber(previous[si].kg) + " kg × " + previous[si].reps : "sem registro"}</small>`).join("")}</article>`;
            })
            .join("") +
          workoutButton(
            "workout-finish",
            "Finalizar e salvar treino",
            "",
            "primary wide",
          ) +
          workoutButton("workout-discard", "Descartar sessão", "", "quiet wide")
        );
      }

function workoutHistory() {
        const w = workoutData(),
          all = Workouts.completed(w),
          start = Ext.period(Core.today(), "weekly");
        const weekly = all.filter(
          (s) =>
            Core.date(new Date(s.finishedAt)) >= start &&
            Core.date(new Date(s.finishedAt)) <= Core.today(),
        );
        const filtered = all.filter(
          (s) =>
            (!workoutDate ||
              Core.date(new Date(s.finishedAt)) === workoutDate) &&
            (workoutExercise === "all" ||
              s.exercises.some(
                (e) =>
                  e.exercise === workoutExercise && e.sets.some((t) => t.done),
              )),
        );
        const exercises = [
          ...new Map(
            [
              ...w.exercises,
              ...all.flatMap((s) =>
                s.exercises.map((e) => ({ id: e.exercise, name: e.name })),
              ),
            ].map((e) => [e.id, e]),
          ).values(),
        ];
        const prs = exercises
          .map((e) => ({
            name: e.name,
            record: workoutRecord({
              sets: all
                .flatMap((s) => s.exercises.filter((x) => x.exercise === e.id))
                .flatMap((e) => e.sets),
            }),
          }))
          .filter((e) => e.record);
        return `<section class="card"><h2>Esta semana</h2><p class="big">${workoutNumber(weekly.reduce((n, s) => n + Workouts.volume(s), 0))} kg</p><p class="muted">Volume · carga × repetições das séries concluídas</p><small>${weekly.length} treino(s) · segunda a domingo. Peso corporal sem carga não soma kg.</small></section><label for="workout-history-date">Filtrar por data</label><input id="workout-history-date" type="date" value="${workoutDate}"><label for="workout-history-exercise">Histórico por exercício</label><select id="workout-history-exercise"><option value="all">Todos os exercícios</option>${exercises.map((e) => `<option value="${esc(e.id)}" ${workoutExercise === e.id ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select>${workoutButton("workout-history-reset", "Limpar filtros", "", "quiet wide")}${workoutChart(all)}<details class="card"><summary>Recordes pessoais · ${prs.length}</summary><p class="footnote">Maior carga; em empate, maior número de repetições. Apenas séries concluídas.</p>${prs.map((e) => `<div class="entry row"><b class="grow">${esc(e.name)}</b><span>${workoutNumber(e.record.kg)} kg × ${e.record.reps}</span></div>`).join("") || '<p class="muted">Seus recordes aparecerão após o primeiro treino.</p>'}</details><div class="section"><h2>Sessões salvas</h2></div>${
          filtered
            .map(
              (s) =>
                `<article class="card"><small>${new Date(s.finishedAt).toLocaleDateString("pt-BR")} · ${Math.max(1, Math.round((s.finishedAt - s.startedAt) / 60000))} min</small><h2>${esc(s.name)}</h2><p class="muted">${workoutNumber(Workouts.volume(s))} kg de volume</p><details><summary>Ver séries</summary>${s.exercises
                  .filter(
                    (e) =>
                      workoutExercise === "all" ||
                      e.exercise === workoutExercise,
                  )
                  .map(
                    (e) =>
                      `<div class="workout-history-exercise"><b>${esc(e.name)}</b>${e.sets.map((t, i) => `<p class="muted">${i + 1} · ${workoutNumber(t.kg)} kg × ${t.reps} · ${t.done ? "Concluída" : "Não realizada"}</p>`).join("")}</div>`,
                  )
                  .join("")}</details></article>`,
            )
            .join("") ||
          empty()
        }`;
      }

function workoutChart(all) {
        const selected = workoutExercise !== "all";
        const points = all
          .filter(
            (s) =>
              (!workoutDate ||
                Core.date(new Date(s.finishedAt)) === workoutDate) &&
              (!selected ||
                s.exercises.some(
                  (e) =>
                    e.exercise === workoutExercise &&
                    e.sets.some((t) => t.done),
                )),
          )
          .slice(0, 10)
          .reverse()
          .map((s) => ({
            date: Core.date(new Date(s.finishedAt)),
            value: selected
              ? Math.max(
                  0,
                  ...s.exercises
                    .filter((e) => e.exercise === workoutExercise)
                    .flatMap((e) =>
                      e.sets.filter((t) => t.done).map((t) => t.kg),
                    ),
                )
              : Workouts.volume(s),
          }));
        if (!points.length) return "";
        const max = Math.max(1, ...points.map((p) => p.value)),
          coords = points.map((p, i) => [
            24 + (i * 252) / Math.max(1, points.length - 1),
            115 - (p.value / max) * 90,
          ]);
        return `<section class="card"><h2>${selected ? "Evolução de carga" : "Evolução de volume"}</h2><p class="footnote">${selected ? "Maior carga concluída por sessão" : "Volume concluído por sessão"}, em kg. Últimas ${points.length} sessões do filtro.</p><svg class="workout-chart" viewBox="0 0 300 140" role="img" aria-label="${selected ? "Carga máxima" : "Volume"} em kg por sessão; valores na tabela abaixo"><path d="M24 15v100h252" fill="none" stroke="var(--line)"/><polyline points="${coords.map((p) => p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3"/>${coords.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)"/>`).join("")}</svg><details><summary>Ver valores do gráfico</summary><table><thead><tr><th>Data</th><th>kg</th></tr></thead><tbody>${points.map((p) => `<tr><td>${shortDate(p.date)}</td><td>${workoutNumber(p.value)}</td></tr>`).join("")}</tbody></table></details></section>`;
      }

// EVENTOS
function registerActions(names, handler) {
  for (const name of names) {
    if (ACTIONS.has(name)) throw Error('Ação duplicada: '+name);
    ACTIONS.set(name,handler);
  }
}

function registerEvent(type, selector, handler) {
  EVENT_RULES[type].push({selector,handler});
}

async function routeEvent(event) {
  try {
    if (event.type==='pointerdown'||event.type==='keydown') {
      unlockModernAudio();
      return;
    }
    if (event.type==='click') {
      const button=event.target.closest('button');
      if (!button) return;
      if (button.dataset.page) {
        if (page==='workouts'&&Workouts.active(workoutData())&&!syncWorkoutInputs()) {
          event.preventDefault();return;
        }
        go(button.dataset.page);
        return;
      }
      const handler=ACTIONS.get(button.dataset.action);
      if (handler) await handler(event);
      return;
    }
    for (const {selector,handler} of EVENT_RULES[event.type]||[]) {
      if (!event.target.matches(selector)) continue;
      await handler(event);
      if (event.cancelBubble) break;
    }
  } catch(error) {showIssue(error.message);}
}

registerEvent("submit", "form[data-form=\"quick-task\"]", quickTask);

registerActions(['finance-view'], event => {financeView = event.target.closest('button').dataset.value;render();});

registerActions(ACTION_GROUPS.navigation, event => {
  const action = event.target.closest('button')?.dataset.action;
  if (action === 'undo-change') undoLastChange();
  if (action === 'search-toggle') {
    taskSearchOpen = !taskSearchOpen;
    if (!taskSearchOpen) query = '';
    render();
    if (taskSearchOpen) $('#search').focus({preventScroll:true});
  }
  if (action === 'navigate-back') {
    try {
      if (page === 'workouts' && Workouts.active(workoutData()) && !syncWorkoutInputs()) return;
      go(navigationTrail.pop() || 'home', {record:false});
    } catch (error) { showIssue(error.message); }
  }
});

registerActions(ACTION_GROUPS.tasks, async (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const d = b.dataset;
        if (d.page) {
          go(d.page);
          return;
        }
        let a = d.action;
        if (!a) return;
        if (a === "close") $("#modal").close();
        if (a === "task") taskForm(d.id);
        if (a === "entry") entryForm(d.id);
        if (a === "budget") budgetForm();
        if (a === "goal") goalForm(d.id);
        if (a === "complete") completeTask(d.id);
        if (a === "subtask") {
          let t = state.tasks.find((t) => t.id === d.id),
            s = t.subtasks[+d.index];
          s.done = !s.done;
          if (!commit(null, {redraw:false})) return;
          b.innerHTML = icon(s.done ? "check" : "box");
        }
        if (a.startsWith("delete-")) {
          let type = a.slice(7),
            collections = {
              task: state.tasks,
              entry: state.finance.entries,
              goal: state.finance.goals,
            };

              const item = arr[i];
              if (type === 'entry' && (item.recurring || item.recurringId)) {
                const root = item.recurringId || item.id;
                state.finance.recurringSkips ??= [];
                state.finance.recurringSkips.push(root + ':' + item.date.slice(0,7));

        if (a === "timer") {
          let t = state.timer;
          if (t.end) {
            t.remaining = Math.max(0, Math.ceil((t.end - Date.now()) / 1000));
            t.end = null;
          } else {
            if (!t.startedAt) {
              const task = state.tasks.find((x) => x.id === state.focusTask);
              t.startedAt = Date.now();
              t.taskId = task?.id || null;
              t.taskTitle = task?.title || "Foco livre";
              t.duration = timerMinutes(t.mode);
              t.remaining = t.duration * 60;
            }
            t.end = Date.now() + t.remaining * 1000;
          }
          if (!commit(null, {redraw:false})) return;
          render();

        if (a === "timer-reset" || a === "timer-mode") {
          if (
            state.timer.startedAt &&
            !await confirmAction("Encerrar esta sessão sem registrá-la?")
          )
            return;
          const mode =
            a === "timer-mode"
              ? state.timer.mode === "focus"
                ? "break"
                : "focus"
              : state.timer.mode;

registerEvent("submit", "form[data-form]:not([data-form=\"quick-task\"])", async (e) => {
        let f = e.target,
          type = f.dataset.form;
        if (!type) return;
        e.preventDefault();
        let v = Object.fromEntries(new FormData(f)),
          id = f.dataset.id;
        try {
          if (type.startsWith("workout-")) {
            workoutSubmit(type, v, id, f);
            return;
          }
          if (type.startsWith("food-")) {
            foodSubmit(type, v, id);
            if (commit(null, {redraw:false})) {
              $("#modal").close();
              render();
              toast("Salvo!");
            }
            return;
          }
          if (type.startsWith("water-")) {
            waterSubmit(type, v, id);
            if (commit(null, {redraw:false})) {
              $("#modal").close();
              render();
              toast("Salvo!");
            }
            return;
          }
          if (type.startsWith("ext-")) {
            if (type === "ext-log") v.taskId = f.dataset.taskId;
            extSubmit(type, v, id);
            if (f.dataset.stopwatch === "true") org().stopwatch = null;
            if (commit(null, {redraw:false})) {
              $("#modal").close();
              render();
              toast("Salvo!");
            }
            return;
          }
          if (type === "task") {
            v.listIds = [...new Set(new FormData(f).getAll("listIds"))].filter(id => org().lists.some(l => l.id === id));
            v.listId = v.listIds[0] || "";
            v.title = v.title.trim();
            if (v.time && !/^([01]\d|2[0-3]):[0-5]\d$/.test(v.time))
              throw Error("Horário inválido.");
            if (!v.title || !Core.validDate(v.date))
              throw Error("Confira o título e a data.");
            let old = state.tasks.find((t) => t.id === id),
              lines = v.subtasks
                .split("\n")
                .map((x) => x.trim())
                .filter(Boolean)
                .slice(0, 30);
            v.subtasks = lines.map((title, i) => ({
              title: title.slice(0, 150),
              done:
                old?.subtasks[i]?.title === title
                  ? old.subtasks[i].done
                  : false,
            }));
            v.minutes = Number(v.minutes);
            
            if (
              v.minutes < 1 ||
              v.minutes > 600
            )
              throw Error("Confira a duração.");
            if (old) {
              if (v.repeat === "none" && old.nextId) {
                const next = state.tasks.find(
                  (t) => t.id === old.nextId && !t.done,
                );
                if (
                  next &&
                  await confirmAction("Parar também a próxima ocorrência já criada?")
                )
                  state.tasks = state.tasks.filter((t) => t.id !== next.id);
              }
              if (old.date !== v.date) old.repeatDay = Number(v.date.slice(8));
              Object.assign(old, v);
              if (old.repeat !== "none" && !old.seriesId) old.seriesId = old.id;
              if (old.done && old.nextId) {
                const pending = state.tasks.find(
                  (t) => t.id === old.nextId && !t.done,
                );
                if (pending && v.repeat !== "none")
                  Object.assign(pending, {
                    title: v.title,
                    listIds: [...v.listIds],
                    listId: v.listId,
                    priority: v.priority,
                    minutes: v.minutes,
                    notes: v.notes,
                    repeat: v.repeat,
                  });
              }
            } else {
              const id = Core.id();
              state.tasks.push({
                ...v,
                id,
                seriesId: v.repeat !== "none" ? id : null,
                done: false,
              });
            }
          }
          if (type === "entry") {
            v.title = v.title.trim();
            v.amount = Core.cents(v.amount);
            if (!v.title || v.amount <= 0 || !Core.validDate(v.date))
              throw Error("Confira descrição, valor e data.");
            if (v.type === "expense" && !categories.includes(v.category))
              v.category = "Outros";
            v.paid = v.paid === "on";
            v.recurring = v.recurring === "on";
            if (id) {
              let old = state.finance.entries.find((x) => x.id === id);
              if (old.date !== v.date) old.repeatDay = Number(v.date.slice(8));
              const root = old.recurringId || old.id;
              if (old.recurring && !v.recurring) state.finance.entries.forEach(x => {
                if ((x.recurringId || x.id) === root) x.recurring = false;
              });
              Object.assign(old, v);
            } else state.finance.entries.push({ ...v, id: Core.id() });
            finMonth = v.date.slice(0, 7);
          }
          if (type === "budget") {
            let b = {};
            categories.forEach((c, i) => {
              if (v["budget" + i].trim()) {
                let n = Core.cents(v["budget" + i]);
                if (n) b[c] = n;
              }
            });
            state.finance.budgets[finMonth] = b;
          }
          if (type === "goal") {
            v.title = v.title.trim();
            v.target = Core.cents(v.target);
            v.saved = Core.cents(v.saved);
            if (!v.title || v.target === 0)
              throw Error("Informe o nome e um objetivo maior que zero.");
            if (id)
              Object.assign(
                state.finance.goals.find((g) => g.id === id),
                v,
              );
            else state.finance.goals.push({ ...v, id: Core.id() });
          }
          if (type === "opening") state.finance.opening = Core.cents(v.opening);
          if (type === "timer") {
            let focus = Number(v.focus),
              pause = Number(v.break);
            if (
              !Number.isInteger(focus) ||
              !Number.isInteger(pause) ||
              focus < 1 ||
              focus > 180 ||
              pause < 1 ||
              pause > 60
            )
              throw Error("Confira a duração.");
            if (state.timer.startedAt)
              throw Error("Reinicie a sessão antes de mudar a duração.");
            state.focus = focus;
            state.break = pause;
            state.timer.remaining = timerMinutes(state.timer.mode) * 60;
          }
          if (type === "profile") {
            state.name = v.name.trim().slice(0, 40);
          }
          if (!commit(null, {redraw:false})) return;
          $("#modal").close();
          render();
          toast("Salvo!");
        } catch (err) {
          let existing = f.querySelector(".form-error");
          if (!existing) {
            existing = document.createElement("p");
            existing.className = "form-error";
            existing.setAttribute("role", "alert");
            f.prepend(existing);
          }
          existing.textContent = err.message;
          existing.scrollIntoView({ block: "nearest" });
        }
      });

registerActions(ACTION_GROUPS.hydration, async (e) => {

            waterTab = d.value;

          }

          if (d.action === "water-log") waterLogForm(undefined, d.date);
          if (d.action === "water-edit") waterLogForm(d.id);
          if (d.action === "water-quick") {
            const amount = Number(d.amount);
            if (![150, 250, 500].includes(amount)) return;
            const l = {
              id: Core.id(),
              at: Date.now(),
              amount,
              beverage: "water",
              note: "",
            };
            Hydration.validate({
              ...state,
              hydration: { ...h, logs: h.logs.concat(l) },
            });
            h.logs.push(l);
            waterUndo = l.id;
            if (commit(null, {redraw:false})) {
              render();
              toast(`${amount} mL registrados. Você pode desfazer.`);
            }
          }
          if (d.action === "water-undo") {
            h.logs = h.logs.filter((l) => l.id !== waterUndo);
            waterUndo = null;
            if (!commit(null, {redraw:false})) return;
            render();
          }
          if (
            d.action === "water-delete" &&
            await confirmAction("Excluir este registro de bebida?")
          ) {
            h.logs = h.logs.filter((l) => l.id !== d.id);
            if (!commit(null, {redraw:false})) return;
            render();
          }
          if (d.action === "water-day") {
            waterDate = Core.addDays(waterDate, Number(d.dir));
            if (waterDate > Core.today()) waterDate = Core.today();
            render();
          }
          if (d.action === "water-now") {
            waterDate = Core.today();
            render();
          }
          if (d.action === "water-chart-day") {
            waterDate = d.value;
            render();
          }
          if (d.action === "water-reminder-toggle") {
            const r = org().reminders.find(
              (r) => r.id === d.id && r.source === "hydration",
            );
            if (r) {
              r.enabled = !r.enabled;
              if (!commit(null, {redraw:false})) return;

          }

            d.action === "water-reminder-remove" &&

              (r) => !(r.id === d.id && r.source === "hydration"),
            );

            render();

registerActions(ACTION_GROUPS.workouts, async (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          const d = b.dataset,
            a = d.action;
          if (!a?.startsWith("workout-") && !d.page) return;
          try {
            if (
              Workouts.active(workoutData()) &&
              page === "workouts" &&
              a !== "workout-discard" &&
              !syncWorkoutInputs()
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return;
            }
            if (!a?.startsWith("workout-")) return;
            e.stopImmediatePropagation();
            e.preventDefault();
            if (a === "workout-tab") {
              workoutTab = d.id;
              render();
            }
            if (a === "workout-exercise") workoutExerciseForm(d.id);
            if (a === "workout-routine") workoutRoutineForm(d.id);
            if (a === "workout-add-row") {
              const box = $("#workout-routine-rows");
              if (box.children.length >= 50)
                throw Error("Limite de 50 exercícios por rotina.");
              box.insertAdjacentHTML(
                "beforeend",
                workoutRoutineRow(
                  {
                    exercise: workoutData().exercises[0].id,
                    sets: 3,
                    reps: 10,
                    kg: 0,
                    rest: 60,
                  },
                  box.children.length,
                ),
              );
              labelRoutineRows();
            }
            if (a === "workout-remove-row") {
              const row = b.closest("fieldset");
              if (row.parentElement.children.length <= 1)
                throw Error("Mantenha pelo menos um exercício.");
              row.remove();
              labelRoutineRows();
            }
            if (a === "workout-row-up") {
              const row = b.closest("fieldset");
              if (row.previousElementSibling)
                row.parentElement.insertBefore(row, row.previousElementSibling);
              labelRoutineRows();
            }
            if (a === "workout-start") {
              const copy = structuredClone(state);
              Workouts.start(copy, d.id);
              workoutCommit(copy.workouts);
              render();
              window.scrollTo({ top: 0, behavior: "instant" });
            }
            if (a === "workout-set") {
              const next = structuredClone(workoutData()),
                s = Workouts.active(next),
                exercise = s.exercises[Number(d.exercise)],
                set = exercise.sets[Number(d.set)];
              set.done = !set.done;
              s.restUntil =
                set.done && exercise.rest
                  ? Date.now() + exercise.rest * 1000
                  : null;
              workoutCommit(next);
              render();
              if (set.done) playModernSound("tap");
            }
            if (a === "workout-skip-rest") {
              const next = structuredClone(workoutData());
              Workouts.active(next).restUntil = null;
              workoutCommit(next);
              paintWorkoutClock();
            }
            if (a === "workout-finish") {
              const s = Workouts.active(workoutData());
              if (!s) throw Error("Nenhum treino ativo.");
              if (!s.exercises.some((e) => e.sets.some((t) => t.done)))
                throw Error("Conclua ao menos uma série.");
              if (
                s.exercises.some((e) => e.sets.some((t) => !t.done)) &&
                !await confirmAction(
                  "Finalizar com séries não realizadas? Apenas as séries concluídas entram no volume e nos recordes.",
                )
              )
                return;
              const copy = structuredClone(state);
              Workouts.finish(copy);
              Workouts.validate(copy);
              const before = state;
              state = copy;
              if (!commit(null, {redraw:false})) {
                state = before;
                throw Error(
                  "Não foi possível salvar o treino. Tente novamente ou exporte um backup.",
                );
              }
              workoutTab = "history";
              render();
              window.scrollTo({ top: 0, behavior: "instant" });
              toast("Treino concluído.");
              playModernSound("success");
            }
            if (a === "workout-discard" && await confirmAction("Descartar esta sessão?")) {
              const next = structuredClone(workoutData());
              next.sessions = next.sessions.filter(
                (s) => s.finishedAt !== null,
              );
              workoutCommit(next);
              render();
            }
            if (a === "workout-history-reset") {
              workoutDate = "";
              workoutExercise = "all";
              render();
            }
          } catch (err) {
            e.stopImmediatePropagation();
            showIssue(err.message);
          }
        });

});
