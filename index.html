<style>
:root{
  --bg:#FAF7F2;--panel:#FFFFFF;--panel2:#F3EEE6;
  --text:#1F1B17;--muted:#8A8378;--line:#EBE5DB;
  --accent:#C1765A;--accent-soft:#F5E7DF;--ink:#FFFFFF;
  --mint:#7A9885;--pink:#C99B9B;--gold:#C9A961;
  --shadow:220 210 195;
  --font-sans:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-serif:'Fraunces','Playfair Display',Georgia,serif;
  color-scheme:light;
}
body.dark{
  --bg:#161412;--panel:#201D1A;--panel2:#2A2622;
  --text:#F5F0E8;--muted:#9A9288;--line:#35302B;
  --accent:#D88D70;--accent-soft:#3A2C24;--ink:#1F1B17;
  --mint:#93B39E;--pink:#D4A5A5;--gold:#D9BC7A;
  --shadow:15 13 11;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 14.5px/1.6 var(--font-sans);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);min-height:44px;border-radius:14px;padding:10px 16px;font-weight:600;display:inline-flex;justify-content:center;align-items:center;gap:8px;transition:transform .15s ease,background .15s ease,border-color .15s ease}
button:disabled{opacity:.4;cursor:default}
button:active:not(:disabled){transform:scale(.985)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;min-height:46px;transition:border-color .15s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:88px}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--accent)}
input[type=color]{padding:4px}
input[type=range]{padding:0;min-height:40px}
label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin:16px 0 7px;letter-spacing:.02em}
.shell{max-width:520px;margin:auto;min-height:100dvh}
header{position:sticky;z-index:4;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;padding-top:max(14px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
header .modern-brand{display:flex;align-items:center;gap:8px;background:transparent;border:none;padding:0;min-height:44px;font-family:var(--font-serif);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--text)}
header .modern-brand .sprite{width:32px;height:32px}
header .modern-actions{display:flex;gap:6px}
header .modern-actions button,header .modern-profile{width:40px;height:40px;min-height:40px;border-radius:12px;padding:8px;background:var(--panel);border:1px solid var(--line)}
header .modern-profile .icon{color:var(--text)}
main{padding:12px 20px calc(120px + env(safe-area-inset-bottom));min-width:0}
h1,h2,h3{font-family:var(--font-serif);font-weight:600;letter-spacing:-.02em}
h1{font-size:28px;line-height:1.15;margin:8px 0 10px;letter-spacing:-.03em}
h2{font-size:18px;line-height:1.25;margin:0}
h3{font-size:15px;margin:0}
p{line-height:1.65;margin:6px 0 12px;font-size:13.5px}
.muted,small{color:var(--muted)}
small{font-size:11.5px;line-height:1.5}
.eyebrow{text-transform:uppercase;font-family:var(--font-sans);font-weight:700;font-size:10px;letter-spacing:.14em;color:var(--muted);margin:8px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row.start{justify-content:flex-start}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.center{text-align:center}
.section{margin-top:28px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.primary:hover:not(:disabled){filter:brightness(1.03)}
.wide{width:100%;margin-top:12px}
.quiet{background:transparent;border:0;padding:6px 8px;color:var(--muted);min-height:40px}
.quiet:hover{color:var(--text)}
.danger{color:var(--pink)}
.positive{color:var(--mint)}
.gold{color:var(--gold)}
.icon{width:20px;height:20px;display:inline-block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.icon-btn{width:44px;flex-shrink:0;padding:8px}
.sprite{width:80px;height:80px;object-fit:contain;display:block}
.smallcat{width:48px;height:48px}
.bigcat{width:112px;height:112px}
.pixel{font-family:var(--font-sans);letter-spacing:-.01em}
progress{display:block;width:100%;height:6px;border:0;appearance:none;border-radius:3px;overflow:hidden;background:var(--panel2)}
progress::-webkit-progress-bar{background:var(--panel2);border-radius:3px}
progress::-webkit-progress-value{background:var(--accent);border-radius:3px}
progress::-moz-progress-bar{background:var(--accent);border-radius:3px}
.scene{height:168px;position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;margin:18px 0 12px;background:var(--panel2)}
body[data-scene="garden"] .scene{background:radial-gradient(ellipse at 75% 25%,rgba(255,220,180,.55) 0%,transparent 45%),linear-gradient(180deg,#C8D5C2 0%,#98AE8F 45%,#5F7259 100%)}
body[data-scene="sunset"] .scene{background:radial-gradient(ellipse at 70% 30%,#FFD9A8 0%,transparent 50%),linear-gradient(180deg,#E8AE85 0%,#C1765A 55%,#6B4A3A 100%)}
body[data-scene="rain"] .scene{background:radial-gradient(ellipse at 50% 100%,rgba(200,215,230,.35) 0%,transparent 60%),linear-gradient(180deg,#9AAFC0 0%,#5F7488 55%,#34455A 100%)}
.scene .sprite{position:absolute;bottom:20px;left:calc(50% - 43px);width:86px;height:86px;animation:float 4s ease-in-out infinite}
.scene .sidecat{width:56px;height:56px;left:14px;bottom:20px;animation-delay:-1.5s;opacity:.95}
.scene .sidecat.right{left:auto;right:12px;width:64px;height:64px;animation-delay:-.7s}
.scene-label{position:absolute;top:14px;left:14px;background:rgba(255,255,255,.85);color:#1F1B17;padding:5px 10px;border-radius:8px;font:600 10px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.dark .scene-label{background:rgba(32,29,26,.85);color:var(--text)}
.stat{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--panel)}
.stat strong{display:block;font-size:18px;font-family:var(--font-serif);font-weight:600}
.stat .icon{color:var(--accent)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel2);border-radius:14px;margin:16px 0}
.tabs button{flex:1;min-height:36px;padding:8px 6px;font-size:12px;font-weight:600;background:none;border:0;color:var(--muted);border-radius:10px}
.tabs .selected{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;font-size:12px;min-height:34px;padding:6px 14px;border-radius:100px;background:var(--panel)}
.chips .selected,.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:8px 0;padding:12px 14px;transition:border-color .15s ease}
.task:hover{border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.task .check{border:0;background:var(--panel2);padding:0;width:32px;height:32px;min-height:32px;border-radius:10px;flex-shrink:0;color:var(--muted);display:grid;place-items:center}
.task .title{font-weight:600;font-size:13.5px;overflow-wrap:anywhere;display:block}
.task small{display:block;margin-top:3px;color:var(--muted)}
.task.done .title{text-decoration:line-through;color:var(--muted);opacity:.65}
.task.done .check{color:var(--accent);background:var(--accent-soft)}
.badge{font-size:9px;padding:3px 8px;background:var(--panel2);border-radius:100px;white-space:nowrap;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.priority{color:var(--pink)}
.empty{text-align:center;padding:32px 16px}
.empty .sprite{width:88px;height:88px;margin:0 auto 8px}
.empty p{color:var(--muted);font-size:13px;max-width:280px;margin:8px auto;line-height:1.6}
.empty
