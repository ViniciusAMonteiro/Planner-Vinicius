<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NEKOQUEST — Organize. Complete. Level Up.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    :root {
      --bg: #0a0c15;
      --bg-2: #12151f;
      --line: #1f2333;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #a78bfa;
      --accent-2: #5ee7ff;
      --accent-glow: rgba(167, 139, 250, 0.35);
      --shadow-sm: rgba(0, 0, 0, 0.2);
      --shadow-lg: rgba(0, 0, 0, 0.38);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(167,139,250,0.18), transparent 18%),
        radial-gradient(circle at bottom right, rgba(94,231,255,0.10), transparent 20%),
        var(--bg);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -30% -10% auto auto;
      width: 65%;
      height: 65%;
      background: radial-gradient(circle, var(--accent-glow), transparent 60%);
      pointer-events: none;
      z-index: 0;
      filter: blur(28px);
    }

    button, input, select, textarea {
      font: inherit;
      border: none;
      outline: none;
    }

    button { cursor: pointer; }

    input, select {
      background: rgba(18, 21, 31, 0.8);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 13px;
      width: 100%;
      transition: 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      background: rgba(18, 21, 31, 0.95);
      box-shadow: 0 0 0 2px rgba(167,139,250,0.13);
    }

    img { max-width: 100%; display: block; }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      padding: 0;
      margin: 0;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10,12,21,0.75);
      border-bottom: 1px solid rgba(167,139,250,0.08);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, rgba(167,139,250,0.2), rgba(94,231,255,0.1));
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 20px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-text span { color: var(--accent); }

    .topbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--text);
      display: grid;
      place-items: center;
      transition: 0.2s ease;
    }

    .icon-btn:active {
      background: rgba(167,139,250,0.15);
      border-color: rgba(167,139,250,0.3);
      transform: translateY(1px);
    }

    .main-content {
      margin-top: 60px;
      margin-bottom: 72px;
      padding: 16px;
    }

    .player-card {
      position: relative;
      background: linear-gradient(135deg, rgba(18,21,31,0.94), rgba(15,17,26,0.96));
      border: 1px solid rgba(167,139,250,0.18);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 14px 36px var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,0.02);
      overflow: hidden;
    }

    .player-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(167,139,250,0.08), transparent 48%);
      pointer-events: none;
    }

    .player-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      position: relative;
      z-index: 1;
    }

    .player-info { flex: 1; }

    .player-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(167,139,250,0.8);
      margin-bottom: 4px;
    }

    .player-level {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      line-height: 1;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.04em;
    }

    .avatar-frame {
      position: relative;
      width: 100px;
      height: 100px;
      border-radius: 16px;
      border: 2px solid var(--accent);
      overflow: hidden;
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 20px var(--accent-glow);
      flex-shrink: 0;
      background: rgba(167,139,250,0.08);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.2));
      pointer-events: none;
    }

    .progress-section {
      position: relative;
      z-index: 1;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(167,139,250,0.1);
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border-radius: inherit;
      box-shadow: 0 0 12px var(--accent-glow);
      transition: width 0.35s ease;
    }

    .title-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.3);
      border-radius: 999px;
      padding: 6px 12px;
      margin-top: 2px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: rgba(18,21,31,0.7);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent);
    }

    .hero-section {
      position: relative;
      background: linear-gradient(135deg, rgba(18,21,31,0.9), rgba(15,17,26,0.9));
      border: 1px solid rgba(167,139,250,0.15);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 12px 30px var(--shadow-lg), inset 0 0 0 1px rgba(255,255,255,0.02);
      min-height: 248px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
    }

    .hero-section::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(167,139,250,0.10), rgba(0,0,0,0));
      z-index: 0;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
      opacity: 0.95;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.05);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 280px;
      padding-top: 14px;
    }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.8rem;
      line-height: 1.08;
      font-weight: 800;
      margin: 0 0 10px;
      letter-spacing: -0.04em;
    }

    .hero-title span { color: var(--accent); }

    .hero-desc {
      font-size: 12px;
      line-height: 1.5;
      color: rgba(243,244,246,0.8);
      margin: 0;
    }

    .tasks-section {
      margin-bottom: 10px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      margin: 0;
    }

    .section-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter-buttons {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-right: 4px;
      scrollbar-width: none;
    }

    .filter-buttons::-webkit-scrollbar { display: none; }

    .filter-btn {
      padding: 7px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    .filter-btn.active {
      background: rgba(167,139,250,0.18);
      border-color: rgba(167,139,250,0.38);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(167,139,250,0.1);
    }

    .clean-btn {
      padding: 7px 10px;
      background: rgba(255, 107, 129, 0.08);
      border: 1px solid rgba(255, 107, 129, 0.25);
      color: #ff8da0;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tasks-container {
      display: grid;
      gap: 10px;
    }

    .task-item {
      background: linear-gradient(135deg, rgba(18,21,31,0.72), rgba(15,17,26,0.72));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      gap: 11px;
      align-items: flex-start;
      transition: 0.2s ease;
      position: relative;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01);
    }

    .task-item:active {
      border-color: rgba(167,139,250,0.3);
      transform: translateY(1px);
      background: rgba(167,139,250,0.08);
    }

    .task-item.completed {
      opacity: 0.72;
    }

    .task-checkbox {
      min-width: 24px;
      width: 24px;
      height: 24px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      display: grid;
      place-items: center;
      margin-top: 2px;
      transition: 0.2s ease;
      color: var(--accent);
      font-size: 12px;
    }

    .task-item.completed .task-checkbox {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: var(--bg);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 6px;
      line-height: 1.3;
      color: var(--text);
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .task-xp {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      background: rgba(167,139,250,0.12);
      border: 1px solid rgba(167,139,250,0.2);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .task-diff {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .task-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .task-btn {
      width: 28px;
      height: 28px;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text-muted);
      display: grid;
      place-items: center;
      font-size: 12px;
      transition: 0.2s ease;
    }

    .task-btn.delete {
      border-color: rgba(255, 107, 129, 0.2);
      color: #ff6b81;
    }

    .task-btn.delete:active {
      background: #ff6b81;
      color: white;
    }

    .task-btn.edit:active {
      background: rgba(94,231,255,0.15);
      color: var(--accent-2);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.02);
      border: 1px dashed rgba(167,139,250,0.2);
      border-radius: 16px;
    }

    .empty-state i {
      font-size: 2rem;
      display: block;
      margin-bottom: 10px;
      color: var(--accent);
    }
