<!DOCTYPE html>

        tailwind.config = {

    <!-- FontAwesome para ícones -->

    <!-- Google Fonts: Inter & Orbitron (Gamer) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Tema Gamer Customizações */
        .font-gamer { font-family: 'Orbitron', sans-serif; }
        
        /* Notificação de Conquista (Toast) */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: rgba(15, 23, 42, 0.95);
            border-left: 4px solid #a855f7; /* Purple neon */
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            transform: translateX(120%);
            animation: slideInToast 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, fadeOutToast 0.4s forwards 3s;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
        @keyframes slideInToast {
            to { transform: translateX(0); }
        }
        @keyframes fadeOutToast {
            to { opacity: 0; transform: translateX(120%); }
        }

        /* Custom scrollbar for task lists */
        .task-list::-webkit-scrollbar {
            width: 4px;
        }
        .task-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .task-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark .task-list::-webkit-scrollbar-thumb {
            background: #475569;
        }
        .task-list::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .task-item {
            animation: fadeIn 0.2s ease-out forwards;
            cursor: grab;
        }
        .task-item:active {
            cursor: grabbing;
        }
        
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }
        
        /* Dropzone highlight */
        .drag-over {
            background-color: rgba(99, 102, 241, 0.05) !important;
            border: 2px dashed rgba(99, 102, 241, 0.4) !important;
            border-radius: 0.75rem;
        }
        .dark .drag-over {
            background-color: rgba(99, 102, 241, 0.15) !important;
        }
    </style>
</head>

    <!-- Service Worker e Manifest Script -->
    <script>
        // 1. Geração Dinâmica do Manifest PWA
        const manifest = {
            name: "Planner Semanal Vinicius",
            short_name: "Planner Vinicius",
            description: "Organize sua rotina com facilidade",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#f8fafc",
            theme_color: "#4f46e5",
            icons: [
                {
                    src: "https://cdn-icons-png.flaticon.com/512/2361/2361819.png", // Ícone genérico de calendário
                    sizes: "192x192",
                    type: "image/png"
                },
                {
                    src: "https://cdn-icons-png.flaticon.com/512/2361/2361819.png",
                    sizes: "512x512",
                    type: "image/png"
                }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        document.getElementById('manifest-link').setAttribute('href', manifestURL);

        // 2. Registro do Service Worker (Simulado em linha para cache offline básico)
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'planner-cache-v1';
                self.addEventListener('install', (event) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (event) => {
                    event.waitUntil(clients.claim());
                });
                self.addEventListener('fetch', (event) => {
                    // Estratégia de cache simples: tenta rede, se falhar tenta cache
                    event.respondWith(
                        fetch(event.request).catch(() => caches.match(event.request))
                    );
                });
            `;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(swBlob);

            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl).then(registration => {
                    console.log('PWA: Service Worker registrado com sucesso!');
                }).catch(err => {
                    console.log('PWA: Falha ao registrar Service Worker:', err);
                });
            });
        }
    </script>

            estudo: { label: 'Estudo', icon: 'fa-book', class: 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300 border border-amber-200 dark:border-amber-800' }

        const priorityData = {

        // Banco de Frases Motivacionais Gamificadas
        const achievementPhrases = [
            "ACHIEVEMENT UNLOCKED: Tarefa Concluída! 🏆",
            "+100 XP Adquirido! 🌟",
            "LEVEL UP! Você está on fire! 🔥",
            "Missão Concluída com Sucesso! 🎯",

        // Estrutura de dados aprimorada
        let plannerData = [
            { id: 'seg', name: 'Segunda-feira', theme: 'red', tasks: [
                { id: generateId(), text: 'Planejar a semana', done: true, priority: 'alta', category: 'trabalho' },
                { id: generateId(), text: 'Reunião de alinhamento', done: false, priority: 'alta', category: 'trabalho' }
            ]},
            { id: 'ter', name: 'Terça-feira', theme: 'orange', tasks: [] },
            { id: 'qua', name: 'Quarta-feira', theme: 'yellow', tasks: [
                { id: generateId(), text: 'Ir à academia', done: false, priority: 'media', category: 'pessoal' },
                { id: generateId(), text: 'Ler artigo sobre IA', done: false, priority: 'baixa', category: 'estudo' }
            ]},
            { id: 'qui', name: 'Quinta-feira', theme: 'green', tasks: [] },
            { id: 'sex', name: 'Sexta-feira', theme: 'blue', tasks: [] },
            { id: 'sab', name: 'Sábado', theme: 'indigo', tasks: [
                { id: generateId(), text: 'Fazer compras da semana', done: false, priority: 'media', category: 'pessoal' }
            ]},
            { id: 'dom', name: 'Domingo', theme: 'purple', tasks: [
                { id: generateId(), text: 'Descansar e ler um livro', done: false, priority: 'baixa', category: 'pessoal' }
            ]}
        ];

        // Temas com efeitos Neon para o Dark Mode (Gamer Theme)
        const themes = {
            red: { bg: 'bg-red-50 dark:bg-slate-900', headerBg: 'bg-red-100 dark:bg-rose-950/40', text: 'text-red-800 dark:text-rose-400', border: 'border-red-200 dark:border-rose-500/50 dark:shadow-[0_0_8px_rgba(244,63,94,0.15)]', btnHover: 'hover:bg-red-100 dark:hover:bg-rose-900/40', check: 'text-red-600 dark:text-rose-400' },
            orange: { bg: 'bg-orange-50 dark:bg-slate-900', headerBg: 'bg-orange-100 dark:bg-orange-950/40', text: 'text-orange-800 dark:text-orange-400', border: 'border-orange-200 dark:border-orange-500/50 dark:shadow-[0_0_8px_rgba(249,115,22,0.15)]', btnHover: 'hover:bg-orange-100 dark:hover:bg-orange-900/40', check: 'text-orange-600 dark:text-orange-400' },
            yellow: { bg: 'bg-yellow-50 dark:bg-slate-900', headerBg: 'bg-yellow-100 dark:bg-yellow-950/40', text: 'text-yellow-800 dark:text-yellow-400', border: 'border-yellow-200 dark:border-yellow-500/50 dark:shadow-[0_0_8px_rgba(234,179,8,0.15)]', btnHover: 'hover:bg-yellow-100 dark:hover:bg-yellow-900/40', check: 'text-yellow-600 dark:text-yellow-400' },
            green: { bg: 'bg-green-50 dark:bg-slate-900', headerBg: 'bg-green-100 dark:bg-emerald-950/40', text: 'text-green-800 dark:text-emerald-400', border: 'border-green-200 dark:border-emerald-500/50 dark:shadow-[0_0_8px_rgba(16,185,129,0.15)]', btnHover: 'hover:bg-green-100 dark:hover:bg-emerald-900/40', check: 'text-green-600 dark:text-emerald-400' },
            blue: { bg: 'bg-blue-50 dark:bg-slate-900', headerBg: 'bg-blue-100 dark:bg-cyan-950/40', text: 'text-blue-800 dark:text-cyan-400', border: 'border-blue-200 dark:border-cyan-500/50 dark:shadow-[0_0_8px_rgba(6,182,212,0.15)]', btnHover: 'hover:bg-blue-100 dark:hover:bg-cyan-900/40', check: 'text-blue-600 dark:text-cyan-400' },
            indigo: { bg: 'bg-indigo-50 dark:bg-slate-900', headerBg: 'bg-indigo-100 dark:bg-indigo-950/40', text: 'text-indigo-800 dark:text-indigo-400', border: 'border-indigo-200 dark:border-indigo-500/50 dark:shadow-[0_0_8px_rgba(99,102,241,0.15)]', btnHover: 'hover:bg-indigo-100 dark:hover:bg-indigo-900/40', check: 'text-indigo-600 dark:text-indigo-400' },
            purple: { bg: 'bg-purple-50 dark:bg-slate-900', headerBg: 'bg-purple-100 dark:bg-fuchsia-950/40', text: 'text-purple-800 dark:text-fuchsia-400', border: 'border-purple-200 dark:border-fuchsia-500/50 dark:shadow-[0_0_8px_rgba(217,70,239,0.15)]', btnHover: 'hover:bg-purple-100 dark:hover:bg-fuchsia-900/40', check: 'text-purple-600 dark:text-fuchsia-400' },
        };

        let addingTaskToDay = null;
        let isDarkMode = false;
        let draggedTask = null; // Guarda informações da tarefa arrastada { dayId, taskId }
        let taskToReplicate = null; // Guarda os dados da tarefa a ser replicada
        let totalXP = 0; // Total de experiência acumulada

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function render() {
            const grid = document.getElementById('planner-grid');
            grid.innerHTML = '';

            plannerData.forEach(day => {
                const theme = themes[day.theme];
                const card = document.createElement('div');
                card.className = `flex flex-col rounded-2xl border ${theme.border} bg-white dark:bg-slate-800 overflow-hidden shadow-sm hover:shadow-md transition-all duration-300 h-[480px]`;
                
                // Cabeçalho do Cartão
                const header = document.createElement('div');
                header.className = `${theme.headerBg} px-4 py-3 flex justify-between items-center border-b ${theme.border}`;
                header.innerHTML = `
                    <h2 class="font-bold ${theme.text}">${day.name}</h2>
                    <span class="text-xs font-semibold px-2.5 py-1 bg-white/70 dark:bg-slate-900/50 rounded-full ${theme.text} shadow-sm">

                    </span>

                card.appendChild(header);

                // Container da Lista de Tarefas (Dropzone)
                const listContainer = document.createElement('div');
                listContainer.className = 'flex-grow p-3 overflow-y-auto task-list flex flex-col gap-2 relative';
                listContainer.id = `list-${day.id}`;
                
                // Eventos de Drag & Drop no container
                listContainer.ondragover = (e) => {
                    e.preventDefault();
                    listContainer.classList.add('drag-over');
                };
                listContainer.ondragleave = (e) => {
                    listContainer.classList.remove('drag-over');
                };
                listContainer.ondrop = (e) => {
                    e.preventDefault();
                    listContainer.classList.remove('drag-over');
                    handleDrop(e, day.id);
                };
                
                if (day.tasks.length === 0) {
                    listContainer.innerHTML = `
                        <div class="flex-grow flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 opacity-70 pointer-events-none">

                            <p class="text-sm">Área livre</p>
                            <p class="text-xs mt-1">Arraste tarefas para cá</p>
                        </div>
                    `;
                }

                // Renderizando tarefas com prioridade, categoria e drag&drop
                day.tasks.forEach(task => {
                    const taskEl = document.createElement('div');
                    taskEl.draggable = true;
                    taskEl.ondragstart = (e) => handleDragStart(e, day.id, task.id);
                    taskEl.ondragend = (e) => handleDragEnd(e);
                    
                    const isDoneStyle = task.done ? 'opacity-60 bg-slate-50 dark:bg-slate-800/80' : 'bg-white dark:bg-slate-700';
                    const textDoneStyle = task.done ? 'line-through text-slate-500 dark:text-slate-400' : 'text-slate-700 dark:text-slate-200';
                    
                    const catInfo = categoryData[task.category];
                    const priInfo = priorityData[task.priority];

                    taskEl.className = `task-item group flex flex-col p-2.5 rounded-xl border border-slate-100 dark:border-slate-600 hover:border-slate-300 dark:hover:border-slate-500 hover:shadow-sm transition-all ${isDoneStyle}`;
                    
                    taskEl.innerHTML = `

                                </div>
                            </div>
                            
                            <div class="flex flex-col items-end gap-2 flex-shrink-0">
                                <div class="opacity-0 group-hover:opacity-100 transition-opacity flex gap-1">
                                    <button onclick="openReplicateModal('${day.id}', '${task.id}')" class="text-slate-300 hover:text-indigo-500 dark:text-slate-500 dark:hover:text-indigo-400 transition-colors px-1" title="Copiar para outro dia">

                            <div class="flex justify-between items-center gap-1 pt-1">
                                <div class="flex gap-2">
                                    <select id="cat-${day.id}" class="text-[11px] font-medium p-1 rounded bg-slate-50 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 cursor-pointer focus:outline-none">

                                        <option value="estudo">📚 Estudo</option>
                                    </select>
                                    <select id="pri-${day.id}" class="text-[11px] font-medium p-1 rounded bg-slate-50 dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 cursor-pointer focus:outline-none">
                                        <option value="baixa">🔵 Pri. Baixa</option>
                                        <option value="media">🟡 Pri. Média</option>
                                        <option value="alta">🔴 Pri. Alta</option>
                                    </select>
                                </div>
                                <div class="flex gap-1">
                                    <button onclick="cancelAddTask()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-1.5 rounded-md transition-colors" title="Cancelar">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                    <button onclick="saveNewTask('${day.id}')" class="bg-indigo-600 text-white hover:bg-indigo-700 p-1.5 px-2.5 rounded-md transition-colors text-xs font-semibold shadow-sm">
                                        <i class="fa-solid fa-check"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                    setTimeout(() => {
                        const input = document.getElementById(`input-${day.id}`);
                        if(input) {
                            input.focus();
                            input.addEventListener('keypress', function (e) {
                                if (e.key === 'Enter') saveNewTask(day.id);
                            });
                        }
                    }, 0);
                } else {
                    const addBtn = document.createElement('button');
                    addBtn.className = `w-full py-2 flex items-center justify-center gap-2 text-sm font-medium ${theme.text} ${theme.btnHover} rounded-xl transition-colors border border-transparent`;
                    addBtn.innerHTML = '<i class="fa-solid fa-plus"></i> Adicionar Tarefa';
                    addBtn.onclick = () => showAddTaskInput(day.id);
                    footer.appendChild(addBtn);
                }

                card.appendChild(footer);
                grid.appendChild(card);
            });

            // Card Resumo final (Mantido e atualizado visualmente)
            renderSummaryCard(grid);
        }

        function renderSummaryCard(grid) {
            const summaryCard = document.createElement('div');
            summaryCard.className = `flex flex-col rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-900 text-white overflow-hidden shadow-lg h-[480px]`;
            
            let totalTasks = 0, completedTasks = 0;
            plannerData.forEach(day => {
                totalTasks += day.tasks.length;
                completedTasks += day.tasks.filter(t => t.done).length;
            });
            const progressPercentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);

            summaryCard.innerHTML = `
                <div class="p-6 flex flex-col h-full relative overflow-hidden bg-slate-900">
                    <div class="absolute -right-6 -top-6 w-32 h-32 bg-indigo-600 rounded-full mix-blend-screen filter blur-2xl opacity-40 animate-pulse"></div>
                    <div class="absolute -left-6 -bottom-6 w-32 h-32 bg-fuchsia-600 rounded-full mix-blend-screen filter blur-2xl opacity-30 animate-pulse" style="animation-delay: 1s;"></div>
                    
                    <div class="relative z-10 flex flex-col h-full">
                        <div class="flex items-center gap-3 mb-6">
                            <div class="w-10 h-10 rounded-xl bg-white/5 flex items-center justify-center backdrop-blur-sm border border-white/10 shadow-[0_0_15px_rgba(168,85,247,0.3)]">
                                <i class="fa-solid fa-gamepad text-xl text-fuchsia-400"></i>
                            </div>
                            <h2 class="text-xl font-bold font-gamer tracking-widest text-white text-shadow">STATUS<span class="text-fuchsia-400">_BAR</span></h2>
                        </div>
                        
                        <div class="flex-grow flex flex-col justify-center gap-6">
                            <div class="bg-slate-800/80 rounded-2xl p-5 border border-slate-700/80 backdrop-blur-sm shadow-[0_4px_20px_rgba(0,0,0,0.5)]">
                                <div class="flex justify-between items-end mb-3">
                                    <span class="text-slate-300 text-xs font-semibold font-gamer tracking-wider">XP DA SEMANA</span>
                                    <span class="text-3xl font-bold font-gamer text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-fuchsia-400">${progressPercentage}%</span>
                                </div>
                                <div class="w-full bg-slate-950 rounded-full h-3 border border-slate-700 shadow-inner mb-3">
                                    <div class="bg-gradient-to-r from-indigo-500 via-purple-500 to-fuchsia-500 h-full rounded-full transition-all duration-1000 relative overflow-hidden shadow-[0_0_10px_rgba(217,70,239,0.5)]" style="width: ${progressPercentage}%">
                                        <div class="absolute top-0 left-0 w-full h-full bg-white/20 animate-pulse"></div>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center border-t border-slate-700/50 pt-2">
                                    <span class="text-slate-400 text-[10px] font-gamer tracking-widest">XP TOTAL ACUMULADO</span>
                                    <span class="text-yellow-400 font-bold font-gamer text-lg flex items-center gap-1"><i class="fa-solid fa-star text-xs"></i> ${totalXP}</span>
                                </div>
                            </div>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 text-center backdrop-blur-sm shadow-md hover:border-indigo-500/50 transition-colors group">
                                    <span class="block text-4xl font-bold text-indigo-400 mb-1 font-gamer group-hover:scale-110 transition-transform">${totalTasks}</span>
                                    <span class="text-[9px] text-slate-400 uppercase tracking-widest font-bold font-gamer">Quests Ativas</span>
                                </div>
                                <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 text-center backdrop-blur-sm shadow-md hover:border-fuchsia-500/50 transition-colors group">
                                    <span class="block text-4xl font-bold text-fuchsia-400 mb-1 font-gamer group-hover:scale-110 transition-transform">${completedTasks}</span>
                                    <span class="text-[9px] text-slate-400 uppercase tracking-widest font-bold font-gamer">Concluídas</span>
                                </div>
                            </div>
                        </div>

                        <div class="mt-auto text-center pt-4">
                            <p class="text-xs font-medium text-slate-300 bg-slate-800/80 py-2.5 px-4 rounded-lg inline-block border border-slate-700/80 font-gamer tracking-wide shadow-[0_0_10px_rgba(0,0,0,0.3)] w-full">
                                ${progressPercentage === 100 && totalTasks > 0 ? "🏆 PLATINA! Semana perfeita!" : 
                                  progressPercentage > 50 ? "🔥 RAMPAGE! Continue assim." : 
                                  totalTasks === 0 ? "📝 Seu inventário está vazio." : "💪 Pressione START para começar!"}
                            </p>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(summaryCard);
        }

        // Handlers de Drag & Drop
        function handleDragStart(e, dayId, taskId) {
            draggedTask = { dayId, taskId };
            e.dataTransfer.effectAllowed = 'move';
            // Efeito visual sutil ao arrastar
            setTimeout(() => e.target.style.opacity = '0.4', 0);
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
            draggedTask = null;
        }

        function handleDrop(e, targetDayId) {
            if (!draggedTask) return;
            const { dayId: sourceDayId, taskId } = draggedTask;
            
            if (sourceDayId === targetDayId) return; // Mesmo dia, não faz nada

            const sourceDay = plannerData.find(d => d.id === sourceDayId);
            const targetDay = plannerData.find(d => d.id === targetDayId);
            const taskIndex = sourceDay.tasks.findIndex(t => t.id === taskId);
            
            if (taskIndex > -1) {
                // Remove da origem e adiciona ao destino
                const [task] = sourceDay.tasks.splice(taskIndex, 1);
                targetDay.tasks.push(task);
                render();
            }
        }

        // Ações CRUD de Tarefas
        function showAddTaskInput(dayId) {
            addingTaskToDay = dayId;
            render();
        }

        function cancelAddTask() {
            addingTaskToDay = null;
            render();
        }

        function saveNewTask(dayId) {
            const input = document.getElementById(`input-${dayId}`);
            const category = document.getElementById(`cat-${dayId}`).value;
            const priority = document.getElementById(`pri-${dayId}`).value;
            const text = input.value.trim();
            
            if (text) {
                const dayObj = plannerData.find(d => d.id === dayId);
                if (dayObj) {
                    dayObj.tasks.push({
                        id: generateId(),
                        text: text,
                        done: false,
                        category: category,
                        priority: priority
                    });
                }
            }
            
            addingTaskToDay = null;
            render();
        }

        function toggleTask(dayId, taskId) {
            const dayObj = plannerData.find(d => d.id === dayId);
            if (dayObj) {
                const task = dayObj.tasks.find(t => t.id === taskId);
                if (task) {
                    task.done = !task.done;
                    if (task.done) {
                        totalXP += 100;
                        triggerAchievementToast();
                    } else {
                        totalXP = Math.max(0, totalXP - 100);
                    }
                    render();
                }
            }
        }
        
        function triggerAchievementToast() {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const phrase = achievementPhrases[Math.floor(Math.random() * achievementPhrases.length)];
            const toast = document.createElement('div');
            toast.className = 'toast-msg flex items-center gap-3';
            toast.innerHTML = `<i class="fa-solid fa-star text-yellow-400 text-lg animate-pulse"></i> <span>${phrase}</span>`;
            
            container.appendChild(toast);
            
            // Remove o toast do DOM após o fim da animação
            setTimeout(() => {
                if(toast.parentNode) toast.remove();
            }, 3500);
        }

        function deleteTask(dayId, taskId) {
            const dayObj = plannerData.find(d => d.id === dayId);
            if (dayObj) {
                dayObj.tasks = dayObj.tasks.filter(t => t.id !== taskId);
                render();
            }
        }

        function resetWeek() {
            let hasChanged = false;
            plannerData.forEach(day => {
                day.tasks.forEach(t => {
                    if (t.done) {
                        t.done = false;
                        hasChanged = true;
                    }
                });
            });
            if (hasChanged) {
                const container = document.getElementById('toast-container');
                if (container) {
                    const toast = document.createElement('div');
                    toast.className = 'toast-msg flex items-center gap-3';
                    toast.style.borderColor = '#10b981'; // Verde para reset
                    toast.style.boxShadow = '0 0 20px rgba(16, 185, 129, 0.4)';
                    toast.innerHTML = `<i class="fa-solid fa-rotate-right text-emerald-400 text-lg"></i> <span>Semana Reiniciada! Missões prontas.</span>`;
                    container.appendChild(toast);
                    setTimeout(() => { if(toast.parentNode) toast.remove(); }, 3500);
                }
                render();
            }
        }

        // Lógica de Replicação de Tarefas
        function openReplicateModal(dayId, taskId) {
            const dayObj = plannerData.find(d => d.id === dayId);
            if (!dayObj) return;
            const task = dayObj.tasks.find(t => t.id === taskId);
            if (!task) return;

            taskToReplicate = { sourceDayId: dayId, task: { ...task } };
            
            document.getElementById('rep-task-name').textContent = task.text;
            
            const container = document.getElementById('rep-days-container');
            container.innerHTML = '';
            
            plannerData.forEach(day => {
                const isSource = day.id === dayId;
                container.innerHTML += `
                    <label class="flex items-center gap-3 p-3 rounded-xl border ${isSource ? 'border-indigo-200 bg-indigo-50 dark:border-indigo-900/50 dark:bg-indigo-900/20 opacity-50 cursor-not-allowed' : 'border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer'} transition-colors">
                        <input type="checkbox" value="${day.id}" ${isSource ? 'checked disabled' : ''} class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 dark:border-slate-600 dark:bg-slate-700">
                        <span class="text-sm font-medium text-slate-700 dark:text-slate-200">${day.name}</span>
                    </label>
                `;
            });

            const modal = document.getElementById('replicate-modal');
            const content = document.getElementById('replicate-modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeReplicateModal() {
            const modal = document.getElementById('replicate-modal');
            const content = document.getElementById('replicate-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                taskToReplicate = null;
            }, 300);
        }

        function confirmReplication() {
            if (!taskToReplicate) return;
            
            const checkboxes = document.querySelectorAll('#rep-days-container input[type="checkbox"]:checked:not(:disabled)');
            let replicated = false;
            
            checkboxes.forEach(cb => {
                const targetDayId = cb.value;
                const targetDay = plannerData.find(d => d.id === targetDayId);
                if (targetDay) {
                    targetDay.tasks.push({
                        ...taskToReplicate.task,
                        id: generateId(),
                        done: false // Tarefas replicadas sempre entram como não-concluídas
                    });
                    replicated = true;
                }
            });

            if (replicated) {
                render();
            }
            closeReplicateModal();
        }

        function updateDateDisplay() {
            const dateDisplay = document.getElementById('current-date-display');
            if(!dateDisplay) return;
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date();
            let dateString = today.toLocaleDateString('pt-BR', options);
            dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
            dateDisplay.textContent = dateString;
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const icon = document.getElementById('theme-icon');
            if(icon) {
                icon.className = isDarkMode ? 'fa-solid fa-sun text-amber-400 text-lg' : 'fa-solid fa-moon text-indigo-500 text-lg';
            }
        }

        // Notificações Diárias ao Meio-dia
        let lastNotificationDate = null;
        function setupDailyNotifications() {
            if ("Notification" in window) {
                // Solicita permissão do navegador
                if (Notification.permission === "default") {
                    Notification.requestPermission();
                }
            }

            setInterval(() => {
                const now = new Date();
                // Verifica se é exatamente 12:00
                if (now.getHours() === 12 && now.getMinutes() === 0) {
                    const dateStr = now.toDateString();
                    if (lastNotificationDate !== dateStr) {
                        if ("Notification" in window && Notification.permission === "granted") {
                            new Notification("Planner Semanal Vinicius", {
                                body: "É meio-dia! Hora de conferir suas missões e garantir o XP do dia. 🎮",
                                icon: "https://cdn-icons-png.flaticon.com/512/2361/2361819.png"
                            });
                        }
                        lastNotificationDate = dateStr;
                    }
                }
            }, 60000); // Checa o horário a cada minuto
        }

        // Inicialização
        window.onload = () => {
            updateDateDisplay();
            // Para garantir a melhor experiência Gamer, iniciamos no Dark Mode
            isDarkMode = true;
            document.documentElement.classList.add('dark');
            updateThemeIcon();
            
            setupDailyNotifications();
            
            render();
        };

    </script>
</body>
</html>
